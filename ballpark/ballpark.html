<title>Ballpark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow scorecard column. The green line-score board sits on top of
   every view; the question, readout and a thumb-reach keypad stack beneath it.
   On wide screens the home view gains a second column for the standings. */
:root{
  --bg:#ecefe7; --surface:#f8faf5; --ink:#15251c; --muted:#59685e; --line:#cdd5c8;
  --board:#1d4a36; --board-2:#153a2a; --board-ink:#f4f1e1; --board-dim:#9fbba9;
  --lamp:#f0b400; --lamp-ink:#241b00; --miss:#b93a29; --accent:#1d5a40; --focus:#1d5a40;
  --z0:#dde3d8; --z1:#c6d7ca; --z2:#a2c1ab; --z3:#74a486; --z4:#3f7d5c;
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1511; --surface:#14211a; --ink:#e8ede4; --muted:#93a399; --line:#27392f;
    --board:#1c4a36; --board-2:#133324; --board-ink:#f4f1e1; --board-dim:#93b3a0;
    --lamp:#f5bf1a; --lamp-ink:#241b00; --miss:#ea6a55; --accent:#86d3a6; --focus:#f5bf1a;
    --z0:#1a2820; --z1:#213a2d; --z2:#2a5240; --z3:#357055; --z4:#46956f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1511; --surface:#14211a; --ink:#e8ede4; --muted:#93a399; --line:#27392f;
  --board:#1c4a36; --board-2:#133324; --board-ink:#f4f1e1; --board-dim:#93b3a0;
  --lamp:#f5bf1a; --lamp-ink:#241b00; --miss:#ea6a55; --accent:#86d3a6; --focus:#f5bf1a;
  --z0:#1a2820; --z1:#213a2d; --z2:#2a5240; --z3:#357055; --z4:#46956f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-text-size-adjust:100%}
#app{min-height:100%;max-width:540px;margin:0 auto;padding-block:14px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,p,ol,dl,dd{margin:0}
ol{padding:0;list-style:none}

.home{display:flex;flex-direction:column;gap:22px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:900px){
  #app.wide{max-width:940px}
  .home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:36px;align-items:start}
}

/* masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.word{font:800 clamp(46px,14vw,66px)/.82 var(--display);text-transform:uppercase;letter-spacing:.01em}
.tag{color:var(--muted);font-size:13px;line-height:1.35;text-align:right;max-width:16ch}

/* line-score board */
.board{background:var(--board);color:var(--board-ink);border-radius:10px;padding:9px 10px 11px;box-shadow:inset 0 0 0 2px var(--board-2)}
.bhead{display:flex;justify-content:space-between;gap:8px;font:600 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--board-dim);padding:2px 2px 8px}
.line{display:grid;grid-template-columns:repeat(9,minmax(0,1fr)) minmax(0,1.9fr);gap:3px}
.cell{background:var(--board-2);border-radius:3px;text-align:center;padding:4px 0 5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell .inn{font:600 10px/1 var(--body);color:var(--board-dim);letter-spacing:.04em}
.cell .val{font:800 21px/1 var(--display);height:21px;font-variant-numeric:tabular-nums}
.cell .pt{font:600 13px/1 var(--display);height:13px;font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
.cell.c-k .pt,.cell.c-f .pt,.cell.tot .pt{color:var(--board-dim)}
.cell.cur{box-shadow:inset 0 0 0 2px var(--lamp)}
.cell.c-hr .val,.cell.tot .val{color:var(--lamp)}
.cell.c-k .val,.cell.c-f .val{color:var(--board-dim)}

/* buttons */
.btn{border:0;border-radius:8px;padding:15px 18px;font:800 23px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;width:100%}
.btn.primary{background:var(--lamp);color:var(--lamp-ink)}
.btn.primary:disabled{background:var(--z0);color:var(--muted)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.small{font-size:18px;padding:11px 14px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}

/* intro */
.pitch{font-size:17px;line-height:1.45;text-wrap:pretty}
.rules{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px}
.rules b{color:var(--ink);font-weight:600}
.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.ladder div{border-radius:4px;padding:6px 0 5px;text-align:center;background:var(--z1);display:flex;flex-direction:column;gap:2px}
.ladder b{font:800 18px/1 var(--display)}
.ladder span{font-size:11px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.ladder .l-hr{background:var(--lamp);color:var(--lamp-ink)}
.ladder .l-hr span{color:var(--lamp-ink)}
.ladder .l-k{background:var(--z0)}

/* final score */
.final{display:flex;flex-direction:column;gap:6px}
.final .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.total{font:800 72px/.85 var(--display);font-variant-numeric:tabular-nums}
.of{color:var(--muted);font-size:14px}
.rank{font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.rankbar{height:8px;border-radius:4px;background:var(--z0);overflow:hidden}
.rankbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.next{font-size:13px;color:var(--muted)}
.innings{display:flex;flex-direction:column}
.innings li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.code{font:800 18px/1 var(--display);background:var(--z1);border-radius:4px;text-align:center;padding:5px 0 4px}
.code.c-hr{background:var(--lamp);color:var(--lamp-ink)}
.code.c-k{background:var(--z0);color:var(--muted)}
.innings .qq{font-size:13px;color:var(--muted);line-height:1.35}
.innings .ga{font-size:14px;font-variant-numeric:tabular-nums}
.innings .pp{font:800 20px/1.1 var(--display);font-variant-numeric:tabular-nums}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}

/* settings + standings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:5px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--board);color:var(--board-ink)}
.panel{background:var(--surface);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 1px var(--line)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel h2{font:800 24px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
#lb-list li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
#lb-list .pos{font:800 18px/1 var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
#lb-list .who{min-width:0}
#lb-list .name{font-weight:600;overflow-wrap:anywhere}
#lb-list .you{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:6px}
#lb-list .sub{display:block;font-size:12px;color:var(--muted);letter-spacing:.02em}
#lb-list .sc{font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);text-wrap:pretty}
.nick{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nick input{font:500 16px/1.2 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px 12px;width:100%;letter-spacing:0;text-transform:none}
#share-fallback{width:100%;font:400 14px/1.4 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px;resize:none}

/* play */
.play{display:flex;flex-direction:column;gap:12px;flex:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{font:800 26px/1 var(--display);text-transform:uppercase}
.quit{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.timer{height:6px;border-radius:3px;background:var(--z0);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);transform-origin:left center;border-radius:3px}
.timer i.low{background:var(--miss)}
.q{display:flex;flex-direction:column;gap:8px;flex:1;padding:4px 0}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qmeta .sec{font-variant-numeric:tabular-nums}
.qmeta .sec.low{color:var(--miss)}
.qtext{font:600 clamp(20px,5.6vw,25px)/1.25 var(--body);text-wrap:balance;letter-spacing:-.01em}
.qhint{font-size:14px;color:var(--muted)}
#stage{display:flex;flex-direction:column;gap:10px}
.readout{border-bottom:2px solid var(--ink);padding:2px 2px 6px;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end}
.readout .num{font:800 46px/1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.readout .num.empty{color:var(--z2)}
.readout .unit{font:600 22px/1 var(--display);color:var(--muted);margin-left:8px;letter-spacing:.02em}
.readout .eq{font-size:13px;color:var(--muted);min-height:20px;font-variant-numeric:tabular-nums}
.mags{display:flex;gap:6px}
.mags button{flex:1;min-width:0;border:0;border-radius:6px;background:transparent;box-shadow:inset 0 0 0 1px var(--line);padding:9px 2px;font-size:13px;font-weight:600;color:var(--muted)}
.mags button[aria-pressed="true"]{background:var(--board);color:var(--board-ink);box-shadow:none}
.mags .neg{flex:0 0 46px;font-size:16px}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pad button{border:0;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);height:clamp(44px,6.8vh,58px);font:800 28px/1 var(--display)}
.pad button:active{background:var(--z1)}
.pad button:disabled{color:var(--z2)}

/* reveal */
.call{background:var(--board);color:var(--board-ink);border-radius:8px;padding:12px 14px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.call .hit{font:800 36px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.call.c-hr .hit{color:var(--lamp)}
.call .pts{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.stripwrap{padding:12px 0 0}
.strip{position:relative;height:30px;border-radius:5px;background:linear-gradient(90deg,
  var(--z0) 0 4.55%,var(--z1) 0 13.64%,var(--z2) 0 27.27%,var(--z3) 0 38.64%,var(--z4) 0 47.73%,
  var(--lamp) 0 52.27%,var(--z4) 0 61.36%,var(--z3) 0 72.73%,var(--z2) 0 86.36%,var(--z1) 0 95.45%,var(--z0) 0)}
.pin{position:absolute;top:-9px;bottom:-5px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--bg);animation:slide .5s cubic-bezier(.2,.8,.2,1) both}
.pin::before{content:"YOU";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:700 10px/1.4 var(--body);letter-spacing:.08em;color:var(--ink);white-space:nowrap}
.pin.off-l::before{content:"‹ YOU";left:0;transform:none}
.pin.off-r::before{content:"YOU ›";left:auto;right:0;transform:none}
@keyframes slide{from{left:50%}}
.zones{position:relative;height:16px;margin-top:4px;font:700 10px/16px var(--body);color:var(--muted);letter-spacing:.03em}
.zones span{position:absolute;transform:translateX(-50%)}
.vs{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;font-variant-numeric:tabular-nums}
.vs dt{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vs dd{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.vs .diff{font-size:13px;font-weight:500;color:var(--muted);text-align:right}
.note{font-size:14px;color:var(--muted);text-wrap:pretty;min-height:1.5em}
@media (prefers-reduced-motion: reduce){.pin{animation:none}}
</style>

<main id="app"></main>

<script>
(function(){
'use strict';

/* ---------- question bank ---------- */
// R = scored on the ratio guess/answer (t = decades of error that score zero)
// L = scored on the plain difference (span = difference that scores zero); Y = a year
const BANK=[];
const R=(id,c,q,a,u,t,n,o)=>BANK.push(Object.assign({id,c,q,a,u,t,n:n||''},o));
const L=(id,c,q,a,u,span,n,o)=>BANK.push(Object.assign({id,c,q,a,u,span,n:n||'',lin:1},o));
const Y=(id,c,q,a,span,n)=>BANK.push({id,c,q,a,u:'year',span,n:n||'',lin:1,y:1});

R('moon-dist','Space','How far away is the Moon, on average?',384400,'km',.5,'Light makes the trip in about 1.3 seconds.');
R('earth-diam','Space','How wide is the Earth at the equator?',12756,'km',.4,'It is very slightly narrower from pole to pole.');
R('sun-width','Space','How many Earths would fit side by side across the face of the Sun?',109,'',.5,'The Sun holds 99.8% of the mass of the solar system.');
R('sunlight','Space','How many minutes does sunlight take to reach Earth?',8.3,'minutes',.5,'About 499 seconds.');
Y('moon-landing','Space','In what year did people first walk on the Moon?',1969,20,'Apollo 11 landed on 20 July.');
R('light-speed','Space','How fast does light travel in a vacuum?',299792,'km/s',.5,'Fast enough to circle the Earth about seven and a half times in a second.');
R('neptune-year','Space','How many Earth years does Neptune take to orbit the Sun?',165,'years',.5,'It has completed just one orbit since it was discovered in 1846.');
R('halley','Space','How many years does Halley’s Comet take to come back around?',76,'years',.4,'Last seen in 1986, due back in 2061.');
R('universe-age','Space','How old is the universe?',13.8e9,'years',.5,'Measured from the afterglow of the Big Bang.');
R('earth-age','Space','How old is the Earth?',4.54e9,'years',.5,'Dated from meteorites that formed alongside it.');
R('moonwalkers','Space','How many people have walked on the Moon?',12,'',.5,'All of them between 1969 and 1972.');
R('sun-temp','Space','How hot is the visible surface of the Sun?',5500,'C',.5,'The core is around 15 million degrees.');
R('moon-diam','Space','How wide is the Moon?',3474,'km',.5,'A little over a quarter of the width of the Earth.');
Y('pluto','Space','In what year was Pluto reclassified as a dwarf planet?',2006,15,'Astronomers voted on it that August.');
Y('sputnik','Space','In what year was Sputnik, the first artificial satellite, launched?',1957,20,'It stayed in orbit for three months.');
R('iss-speed','Space','How fast does the International Space Station travel?',27600,'km/h',.5,'It laps the planet roughly every 90 minutes.');
R('iss-alt','Space','How high above the Earth does the International Space Station orbit?',400,'km',.5,'The altitude sags and gets boosted back up every few months.');
R('sun-dist','Space','How far is the Earth from the Sun, on average?',149.6e6,'km',.5,'This distance defines one astronomical unit.');
R('earths-in-sun','Space','How many Earths could fit inside the Sun by volume?',1.3e6,'',1,'The usual figure is 1.3 million.');
R('proxima','Space','How many light-years away is the nearest star other than the Sun?',4.24,'light-years',.5,'Proxima Centauri, a small red dwarf.');
R('milky-way','Space','About how many stars are in the Milky Way?',200e9,'',1.5,'Estimates run from 100 billion to 400 billion.');
R('moon-gravity','Space','The Moon’s surface gravity is what percentage of Earth’s?',16.6,'%',.5,'About one sixth.');
Y('hubble','Space','In what year was the Hubble Space Telescope launched?',1990,20,'Astronauts fitted corrective optics in 1993.');
R('moon-orbit','Space','How many days does the Moon take to orbit the Earth?',27.3,'days',.4,'New moon to new moon takes 29.5 days, because the Earth is moving too.');
Y('voyager','Space','In what year were the Voyager probes launched?',1977,20,'Voyager 1 is now the most distant human-made object.');
R('mercury-year','Space','How many Earth days long is a year on Mercury?',88,'days',.4,'The shortest year of any planet.');
R('earth-orbit-speed','Space','How fast does the Earth move along its orbit around the Sun?',107000,'km/h',.6,'Roughly 30 km, or 19 miles, every second.');
R('earth-spin','Space','How fast is the ground at the equator moving because of the Earth’s spin?',1670,'km/h',.5,'One full circumference every 24 hours.');

R('everest','Earth','How tall is Mount Everest?',8849,'m',.4,'China and Nepal agreed a joint new measurement in 2020.');
R('mariana','Earth','How deep is the deepest point in the ocean?',10935,'m',.4,'Challenger Deep, in the Mariana Trench.');
R('nile','Earth','How long is the Nile?',6650,'km',.5,'It flows north through eleven countries.');
R('un','Earth','How many member states does the United Nations have?',193,'',.4,'South Sudan was the most recent to join, in 2011.');
R('africa','Earth','How many countries are in Africa?',54,'',.4,'More than any other continent.');
R('russia-tz','Earth','How many time zones does Russia span?',11,'',.4,'From Kaliningrad to Kamchatka.');
R('water-cover','Earth','What percentage of the Earth’s surface is covered by water?',71,'%',.4,'Nearly all of it is ocean.');
R('sahara','Earth','How large is the Sahara desert?',9.2e6,'km2',.6,'Comparable to the whole of the United States.');
R('equator','Earth','How long is the equator?',40075,'km',.4,'The metre was first defined as one ten-millionth of the distance from pole to equator.');
R('great-wall','Earth','How long is the Great Wall of China, counting every section ever built?',21196,'km',.7,'The figure comes from a five-year survey published in 2012.');
R('angel-falls','Earth','How tall is Angel Falls, the highest waterfall on Earth?',979,'m',.5,'In Venezuela, named after the pilot Jimmie Angel.');
L('hottest','Earth','What is the highest air temperature ever recorded on Earth?',56.7,'C',25,'Death Valley, California, on 10 July 1913.');
L('coldest','Earth','What is the lowest natural temperature ever recorded at ground level?',-89.2,'C',50,'Vostok Station, Antarctica, in July 1983.',{neg:1});
R('baikal','Earth','How deep is Lake Baikal, the deepest lake in the world?',1642,'m',.5,'It holds about a fifth of the world’s unfrozen fresh water.');
R('fresh-water','Earth','What percentage of the Earth’s water is fresh water?',2.5,'%',.5,'Most of that is locked up in ice.');
R('australia','Earth','What is the area of Australia?',7.69e6,'km2',.5,'The sixth-largest country in the world.');
R('philippines','Earth','How many islands make up the Philippines?',7641,'',.7,'The count rose from 7,107 after a 2016 survey.');
R('kilimanjaro','Earth','How tall is Mount Kilimanjaro?',5895,'m',.4,'The highest free-standing mountain in the world.');
R('dover','Earth','How wide is the English Channel at its narrowest point?',33,'km',.5,'The Strait of Dover.');
R('panama-len','Earth','How long is the Panama Canal?',82,'km',.5,'A transit takes eight to ten hours.');
R('suez-len','Earth','How long is the Suez Canal?',193,'km',.5,'It has no locks.');
Y('panama-year','Earth','In what year did the Panama Canal open?',1914,40,'Two weeks after the First World War began.');
R('iceland','Earth','How many people live in Iceland?',390000,'',.6,'About two thirds of them live in or around Reykjavík.');
Y('billion','Earth','In roughly what year did the world population first reach one billion?',1804,100,'The second billion took until 1927.');
R('pop-1900','Earth','What was the world population in 1900?',1.6e9,'',.5,'It has grown about fivefold since.');
R('languages','Earth','How many living languages are spoken in the world today?',7100,'',.7,'Around 40% of them are endangered.');
R('trans-sib','Earth','How long is the Trans-Siberian Railway from Moscow to Vladivostok?',9289,'km',.5,'The through train takes about seven days.');
R('lon-nyc','Earth','How far is London from New York in a straight line?',5570,'km',.4,'About seven and a half hours by jet.');
R('finland','Earth','Finland is called the land of a thousand lakes. How many does it have?',187888,'',1,'Counting every lake larger than 500 square metres.');
R('ocean-depth','Earth','What is the average depth of the ocean?',3700,'m',.5,'Deeper than most people guess.');
R('us-parks','Earth','How many national parks does the United States have?',63,'',.5,'New River Gorge was the latest addition, in 2020.');

  BANK.forEach(q=>(by[q.c]=by[q.c]||[]).push(q.id));
  const pos=[];
  Object.keys(by).sort().forEach(k=>{const a=shuffle(by[k],r);a.forEach((id,j)=>pos.push([(j+r())/a.length,id]))});
  pos.sort((x,y)=>x[0]-y[0]||(x[1]<y[1]?-1:1));

/* ---------- units, scoring, formatting ---------- */
const nf=(n,d)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d==null?0:d});
function viewOf(q){
  const imp=S.units==='imperial';
  if(q.u==='C'){
    if(imp){const t=q.a*1.8+32;return {t,shown:Math.round(t),u:'°F',span:q.span&&q.span*1.8}}
    return {t:q.a,shown:q.a,u:'°C',span:q.span};
  }
  if(imp&&CONV[q.u]){const t=q.a*CONV[q.u][1];return {t,shown:Number(t.toPrecision(t>=1000?4:3)),u:CONV[q.u][0],span:q.span}}
  return {t:q.a,shown:q.a,u:LABEL[q.u]||q.u,span:q.span};
}
function scoreOf(q,v,g){
  if(q.lin)return Math.round(1000*Math.max(0,1-Math.abs(g-v.t)/v.span));
  if(!(g>0)||!(v.t>0))return 0;
  const e=Math.max(0,Math.abs(Math.log10(g/v.t))-DZ);
  return Math.round(1000*Math.max(0,1-e/q.t));
}
function posOf(q,v,g){                                   // -1.1 .. 1.1 along the strip
  let x;
  if(q.lin)x=(g-v.t)/v.span; else x=g>0?Math.log10(g/v.t)/q.t:-9;
  return Math.max(-1.1,Math.min(1.1,x));
}
function fmtNum(q,n){
  if(q.y)return String(Math.round(n));
  const a=Math.abs(n);
  if(a>=1e12)return nf(n/1e12,2)+' trillion';
  if(a>=1e9)return nf(n/1e9,2)+' billion';
  return nf(n,3);
}
function withUnit(s,q,v){if(q.y||!v.u)return s;return v.u==='%'||v.u[0]==='°'?s+v.u:s+' '+v.u}
function diffText(q,v,g){
  if(q.y){const d=Math.round(g-v.t);return d===0?'Exact year':Math.abs(d)+(Math.abs(d)===1?' year ':' years ')+(d>0?'late':'early')}
  if(q.lin){const d=g-v.t;return Math.abs(d)<0.05?'Dead on':nf(Math.abs(d),1)+(d>0?' too high':' too low')}
  if(!(g>0))return 'Far too low';
  const r=g/v.t;
  if(Math.abs(r-1)<0.005)return 'Dead on';
  if(r>=2)return nf(r,r>=20?0:1)+'× too high';
  if(r<=0.5)return nf(1/r,1/r>=20?0:1)+'× too low';
  return Math.round(Math.abs(r-1)*100)+'% '+(r>1?'high':'low');
}
function hintOf(q,v){
  if(q.y)return 'Answer with a year.';
  if(!v.u)return 'Answer with a number.';
  if(v.u==='%')return 'Answer as a percentage.';
  return 'Answer in '+v.u+'.';
}

  if(rows){
    items=rows.map(r=>{
      const days=r.days&&typeof r.days==='object'?r.days:{};
      if(lbTab==='today'){const x=days[d];return x&&{id:r.id,nick:r.nick,score:Number(x.s)||0,sub:String(x.h||'').slice(0,40)}}
      if(lbTab==='week'){let s=0,n=0;for(let k=d-6;k<=d;k++)if(days[k]){s+=Number(days[k].s)||0;n++}
        return n?{id:r.id,nick:r.nick,score:s,sub:n+(n===1?' game':' games')}:null}
      const g=Number(r.games)||0, t=Number(r.sum)||0;
      return g?{id:r.id,nick:r.nick,score:t,sub:g+(g===1?' game':' games')+' · average '+nf(Math.round(t/g))}:null;
    }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,50);
    if(!items.length&&cloud!=='loading')msg=lbTab==='today'?'Nobody has finished today’s game yet. Play all nine innings and your score goes up here.':'No scores on the board yet.';
    else if(cloud==='slow')msg='These standings may be out of date. Still trying to reach the latest.';
    if(cloud==='ready'&&(!uid||canWrite===false))msg=(msg?msg+' ':'')+'You can read the standings here. To post your own scores, ask the page’s owner to give you Contributor or Editor access.';
  }else if(cloud==='slow')msg='The standings can’t be reached yet. Still trying.';
  let ps={};
  if(user&&items.length){try{ps=await user.profiles(items.map(i=>i.id))}catch(e){}}
  if(seq!==lbSeq)return;
  list.replaceChildren(...items.map((it,i)=>{
    const name=(typeof it.nick==='string'&&it.nick.trim().slice(0,16))||(ps[it.id]&&ps[it.id].name)||'Player';
    return h('li',null,h('span',{class:'pos',text:i+1}),
      h('span',{class:'who'},h('span',{class:'name',text:name}),it.id===uid?h('span',{class:'you',text:'You'}):null,h('span',{class:'sub',text:it.sub})),
      h('span',{class:'sc',text:nf(it.score)}));
  }));
  note.textContent=msg;note.hidden=!msg;
}
function onRows(){
  const m=myRow(), d=today();
  // Finished today's game on another device: lock it here too.
  if(m&&m.days&&m.days[d]&&!(S.days[d]&&S.days[d].done)&&!(G&&G.mode==='daily')){
    S.days[d]={done:true,remote:true,total:Number(m.days[d].s)||0,hits:String(m.days[d].h||'').split(' ').filter(Boolean).slice(0,PER),
      pts:Array.isArray(m.days[d].p)?m.days[d].p.slice(0,PER).map(n=>Number(n)||0):null,ids:[],res:[]};
    save();if(view==='home')return renderHome();
  }
  if(view==='home'){const st=$('#stats');if(st)st.replaceWith(statsRow())}
  renderStandings();
}
function postScores(){
  writing=writing.then(async()=>{
    if(!db||!uid||canWrite===false)return;
    const ref=db.doc('scores/'+uid), snap=await ref.get();
    const c=snap.exists?JSON.parse(JSON.stringify(snap.data())):{v:1,nick:'',days:{},games:0,sum:0,best:0,streak:0,last:-1,pruned:-1};
    if(!c.days||typeof c.days!=='object')c.days={};
    let changed=false;
    const pruned=c.pruned==null?-1:Number(c.pruned);
    Object.keys(S.days).map(Number).sort((a,b)=>a-b).forEach(d=>{
      const rec=S.days[d];
      if(!rec.done||rec.remote||c.days[d]||d<=pruned)return;
      c.days[d]={s:rec.total,h:rec.hits.join(' '),p:rec.res.map(r=>r.p)};
      c.games=(Number(c.games)||0)+1;c.sum=(Number(c.sum)||0)+rec.total;c.best=Math.max(Number(c.best)||0,rec.total);
      const last=c.last==null?-1:Number(c.last);
      if(d>last){c.streak=last===d-1?(Number(c.streak)||0)+1:1;c.last=d}
      changed=true;
    });
    const ks=Object.keys(c.days).map(Number).sort((a,b)=>a-b);
    while(ks.length>14){const k=ks.shift();delete c.days[k];c.pruned=Math.max(c.pruned==null?-1:Number(c.pruned),k);changed=true}
    if((snap.exists||changed)&&(c.nick||'')!==(S.nick||'')){c.nick=S.nick||'';changed=true}
    if(changed)await ref.set(c);
  }).catch(e=>{if(e&&e.code==='invalid_argument'){canWrite=false;renderStandings()}});
}
async function initCloud(){
  if(!(window.claude&&window.claude.use)){cloud='off';return renderStandings()}
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){db=null}
  if(!db){cloud='off';return renderStandings()}
  if(user){try{uid=await user.id();canWrite=await user.can('data.write')}catch(e){}}
  const slow=setTimeout(()=>{if(cloud==='loading'){cloud='slow';renderStandings()}},10000);
  db.collection('scores').onSnapshot(snap=>{
    rows=snap.docs.map(x=>Object.assign({},x.data(),{id:x.id}));
    if(!snap.metadata.fromCache){clearTimeout(slow);cloud='ready'}
    onRows();
  },()=>{clearTimeout(slow);cloud='error';renderStandings()});
  postScores();
}

/* ---------- boot ---------- */
function start(){load();renderHome();initCloud()}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start();
})();
</script>

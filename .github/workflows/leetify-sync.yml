name: Leetify sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetify-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Leetify data
        env:
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
        run: python3 scripts/fetch_leetify.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cs2/data
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "chore: sync Leetify data"
            git push
          fi

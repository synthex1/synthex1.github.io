<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 performance — synthex</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --surface-2: #f2f2ee;
    --page: #f9f9f7;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;   /* blue  — primary / win */
    --series-2: #eb6834;   /* orange — loss */
    --pos: #2a78d6;        /* diverging pole: above baseline */
    --neg: #e34948;        /* diverging pole: below baseline */
    --demph: #c3c2b7;      /* de-emphasis / tie */
    --up-good: #006300;
    --brand-leetify: #6a5cf0;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --surface-2: #232322;
      --page: #0d0d0d;
      --ink-1: #ffffff;
      --ink-2: #c3c2b7;
      --ink-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --pos: #3987e5;
      --neg: #e66767;
      --demph: #52514e;
      --up-good: #0ca30c;
      --brand-leetify: #8f83ff;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --surface-2: #232322;
    --page: #0d0d0d;
    --ink-1: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --pos: #3987e5;
    --neg: #e66767;
    --demph: #52514e;
    --up-good: #0ca30c;
    --brand-leetify: #8f83ff;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* author display rules must not beat it */
  body.viz-root {
    margin: 0;
    background: var(--page);
    color: var(--ink-1);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 22px 72px; }
  header h1 { font-size: 27px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--ink-2); margin: 6px 0 0; font-size: 15px; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin: 22px 0 18px;
  }
  .filters .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--surface-1); }
  .filters button.opt {
    appearance: none; border: 0; background: transparent; color: var(--ink-2);
    font: inherit; font-size: 14px; padding: 7px 14px; cursor: pointer;
  }
  .filters button.opt[aria-pressed="true"] { background: var(--series-1); color: #fff; }
  .filters button.opt:not([aria-pressed="true"]):hover { color: var(--ink-1); }
  /* co-selected players sit behind the one whose stats are actually shown */
  #playerSeg button.opt[aria-pressed="true"] {
    background: color-mix(in srgb, var(--series-1) 30%, var(--surface-1)); color: var(--ink-1);
  }
  #playerSeg button.opt.lead[aria-pressed="true"] { background: var(--series-1); color: #fff; }
  .tbtn[aria-pressed="true"] { background: var(--series-1); border-color: var(--series-1); color: #fff; }
  .datatable td.lead { color: var(--ink-1); font-weight: 650; }
  .filters .flabel { font-size: 13px; color: var(--ink-muted); margin-left: 6px; }
  .pwrap { display: inline-flex; align-items: center; gap: 8px; }
  .psel {
    appearance: none; font: inherit; font-size: 14px; padding: 6px 30px 6px 12px;
    border: 1px solid var(--border); border-radius: 9px; background: var(--surface-1);
    color: var(--ink-1); cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%),
                      linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%);
    background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }

  .kpi-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
    gap: 14px; margin-bottom: 8px;
  }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .tile .tlabel { font-size: 13px; color: var(--ink-muted); display: flex; align-items: center; gap: 7px; }
  .tile .tvalue { font-size: 32px; font-weight: 600; margin-top: 3px; letter-spacing: -0.02em; white-space: nowrap; }
  .tile .tdelta { font-size: 13px; margin-top: 3px; color: var(--ink-2); }
  .tile .tdelta.good { color: var(--up-good); }
  .tile .tdelta.bad { color: var(--neg); }

  /* ---- sections ---- */
  section.sect { margin-top: 34px; }
  .shead { display: flex; align-items: center; gap: 11px; margin-bottom: 4px; }
  .shead h2 { font-size: 21px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .ssub { color: var(--ink-2); font-size: 14px; margin: 0 0 14px; max-width: 78ch; }
  .ssub a { color: var(--series-1); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(500px, 100%), 1fr)); gap: 16px; }
  figure.card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; margin: 0; padding: 16px 18px 14px; min-width: 0;
  }
  figure.card.wide { grid-column: 1 / -1; }
  .card-head { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 11px; align-items: center; }
  .card-head h3 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .card-head .csub { font-size: 13px; color: var(--ink-muted); grid-column: 1 / -1; }
  p.csub { font-size: 13px; color: var(--ink-muted); margin: 10px 0 0; max-width: 72ch; }
  .card-head .mark { grid-row: 1; }
  .chead-right { display: flex; align-items: center; gap: 10px; }
  .tbtn {
    appearance: none; border: 1px solid var(--border); background: transparent;
    color: var(--ink-2); border-radius: 7px; font: inherit; font-size: 12px;
    padding: 3px 10px; cursor: pointer;
  }
  .tbtn:hover { color: var(--ink-1); }
  .cbody { margin-top: 10px; }
  .cbody svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin-top: 8px; flex-wrap: wrap; }
  .legend .key { display: inline-flex; align-items: center; gap: 7px; }
  .legend .swatch { width: 12px; height: 12px; border-radius: 3px; }
  .legend .linekey { width: 16px; height: 3px; border-radius: 2px; }

  /* ---- brand / map marks ---- */
  .mark { flex: none; display: block; }
  .mark .mk-bg { fill: currentColor; opacity: 0.15; }
  .mark .f { fill: currentColor; }
  .mark .s { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  a.brand { display: inline-flex; align-items: center; gap: 7px; color: inherit; text-decoration: none; }
  a.brand:hover .bname { text-decoration: underline; }
  .bname { font-size: 12px; color: var(--ink-muted); }

  /* ---- map cards ---- */
  .mapgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(232px, 100%), 1fr)); gap: 14px; }
  .mapcard {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 15px 15px;
    display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; align-items: center;
  }
  .mapcard .mark { grid-row: 1 / span 2; }
  .mapcard .mname { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; align-self: end; }
  .mapcard .mmeta { font-size: 13px; color: var(--ink-muted); align-self: start; font-variant-numeric: tabular-nums; }
  .mapcard .mwr { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 9px; margin-top: 11px; }
  .mapcard .mwr b { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .mapcard .mwr span { font-size: 13px; color: var(--ink-muted); }
  .meter {
    grid-column: 1 / -1; position: relative; height: 9px; border-radius: 5px;
    background: var(--surface-2); border: 1px solid var(--border); margin-top: 8px; overflow: hidden;
  }
  .meter i { position: absolute; inset: 0 auto 0 0; display: block; border-radius: 5px; }
  .meter u {
    position: absolute; top: -2px; bottom: -2px; left: 50%; width: 1px;
    background: var(--axis); text-decoration: none;
  }
  .mapcard .mrat { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .smallmaps { font-size: 13px; color: var(--ink-muted); margin: 12px 0 0; }

  .datatable { display: none; overflow-x: auto; margin-top: 10px; }
  .datatable.open { display: block; }
  .datatable table { border-collapse: collapse; font-size: 13.5px; width: 100%; }
  .datatable th, .datatable td { text-align: right; padding: 5px 11px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  .datatable th:first-child, .datatable td:first-child { text-align: left; }
  .datatable th { color: var(--ink-muted); font-weight: 500; }

  svg text { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-muted); }
  svg text.val { fill: var(--ink-2); font-variant-numeric: tabular-nums; }
  /* halo keeps value labels legible where they sit over a line or a bar */
  svg text.emph {
    fill: var(--ink-1); font-weight: 650; font-size: 15px;
    paint-order: stroke; stroke: var(--surface-1); stroke-width: 4px; stroke-linejoin: round;
  }
  svg text.axlab { font-size: 13px; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axisline { stroke: var(--axis); stroke-width: 1.25; }
  .s1 { fill: var(--series-1); } .s1s { stroke: var(--series-1); }
  .s2 { fill: var(--series-2); } .s2s { stroke: var(--series-2); }
  .pos { fill: var(--pos); } .neg { fill: var(--neg); }
  .demph { fill: var(--demph); }
  .ring { stroke: var(--surface-1); stroke-width: 2; }
  .crosshair { stroke: var(--axis); stroke-width: 1; }
  .hit { fill: transparent; pointer-events: all; }
  .hoverable:hover { filter: brightness(1.15); }
  .faded { opacity: 0.42; }

  .tooltip {
    position: fixed; z-index: 10; pointer-events: none;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 9px; padding: 9px 11px; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.16); max-width: 300px;
  }
  .tooltip .tt-title { color: var(--ink-muted); margin-bottom: 5px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 7px; }
  .tooltip .tt-key { width: 11px; height: 3px; border-radius: 2px; flex: none; }
  .tooltip .tt-val { font-weight: 650; color: var(--ink-1); font-variant-numeric: tabular-nums; }
  .tooltip .tt-lab { color: var(--ink-2); }

  .method {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 15px 18px; margin-bottom: 16px; font-size: 14px; color: var(--ink-2);
  }
  .method h4 { margin: 0 0 8px; font-size: 14px; color: var(--ink-1); font-weight: 650; }
  .cmpbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  details.method summary {
    cursor: pointer; font-weight: 650; color: var(--ink-1); font-size: 14px;
    list-style-position: outside; margin-left: 2px;
  }
  details.method[open] summary { margin-bottom: 10px; }
  details.method ol { margin-top: 0; }

  /* real-units comparison between soft and tough lobbies */
  .deltalist { display: flex; flex-direction: column; }
  .drow {
    display: grid; grid-template-columns: minmax(180px, 1.4fr) auto minmax(60px, 1fr) 62px;
    gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--grid);
  }
  .drow:last-child { border-bottom: 0; }
  .dname { font-size: 14px; color: var(--ink-1); display: flex; flex-direction: column; }
  .dname small { font-size: 12px; color: var(--ink-muted); font-weight: 400; }
  .dvals { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }
  .dfrom { color: var(--ink-muted); }
  .darrow { color: var(--axis); }
  .dto { color: var(--ink-2); font-weight: 600; }
  .dto.up { color: var(--pos); }
  .dbar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .dbar i { display: block; height: 100%; border-radius: 4px; }
  .dpct { text-align: right; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .drow { grid-template-columns: 1fr auto; gap: 4px 10px; }
    .dbar { grid-column: 1 / -1; }
    .dpct { grid-row: 1; grid-column: 2; }
  }
  .method ol { margin: 0; padding-left: 20px; }
  .method li { margin-bottom: 5px; }
  .method li:last-child { margin-bottom: 0; }
  .method b { color: var(--ink-1); font-weight: 600; }
  .note { color: var(--ink-muted); font-size: 13px; margin-top: 30px; }
  .note a { color: var(--series-1); }
  #status { color: var(--ink-2); padding: 40px 0; }
</style>
</head>
<body class="viz-root">
<div class="wrap">
  <header>
    <h1>CS2 performance</h1>
    <p class="sub" id="subtitle">Loading data…</p>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Filters" hidden>
    <div class="seg" id="viewSeg" role="group" aria-label="View"></div>
    <div class="seg" id="playerSeg" role="group" aria-label="Player"></div>
    <div class="seg" id="rangeSeg" role="group" aria-label="Date range"></div>
    <div class="seg" id="queueSeg" role="group" aria-label="Queue"></div>
    <span class="pwrap" id="partyWrap" hidden></span>
    <span class="flabel" id="filterNote"></span>
  </div>

  <p id="status">Loading match archive…</p>
  <section class="kpi-row" id="kpis"></section>
  <main id="sections"></main>

  <p class="note">
    Data from the <a href="https://api-public-docs.cs-prod.leetify.com">Leetify public API</a>,
    synced daily by a GitHub Action. Leetify rating is shown ×100, as on leetify.com.
    Map and queue marks are drawn for this page and aren't official artwork.
  </p>
</div>
<div class="tooltip" id="tooltip" hidden></div>

<script>
(async function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const SVGNS = "http://www.w3.org/2000/svg";

  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid != null) n.append(kid);
    return n;
  }
  function svg(tag, attrs = {}) {
    const n = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    return n;
  }
  const fmt1 = (v) => {
    if (v == null) return "–";
    const r = Math.round(v * 10) / 10;
    return (r === 0 ? 0 : r).toLocaleString("en-US", { maximumFractionDigits: 1 });
  };
  const fmt2 = (v) => (v == null ? "–" : v.toFixed(2));
  const fmtPct = (v) => (v == null ? "–" : Math.round(v * 100) + "%");
  const fmtRating = (v) => (v == null ? "–" : (v >= 0 ? "+" : "") + (v * 100).toFixed(2));
  const signed = (v, f = fmt1) => {
    if (v == null) return "–";
    const s = f(Math.abs(v));
    return parseFloat(s) === 0 ? s : (v >= 0 ? "+" : "−") + s;   // no "+0" / "−0"
  };
  const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  const median = (a) => {
    const s = a.filter((v) => v != null).slice().sort((x, y) => x - y);
    return s.length ? s[Math.floor(s.length / 2)] : null;
  };

  // ---------- marks (hand-drawn, 24×24) ----------
  const GENERIC_MAP = [["path", { d: "M4 6.5l5-2 6 2 5-2v13l-5 2-6-2-5 2z", class: "s" }],
                       ["path", { d: "M9 4.5v13M15 6.5v13", class: "s" }]];
  const MAP_MARKS = {

    de_dust2:    { accent: "#cfa53f", g: [["circle", { cx: 12, cy: 8.6, r: 3.5, class: "f" }],

                                          ["path", { d: "M3.5 20h17", class: "s" }]] },
    de_overpass: { accent: "#6f93b8", g: [["path", { d: "M2.8 11.2h18.4M12 11.2V6.4", class: "s" }],

    de_train:    { accent: "#7f8a97", g: [["rect", { x: 4, y: 5.4, width: 16, height: 10, rx: 2.2, class: "s" }],

    de_vertigo:  { accent: "#98a2ad", g: [["path", { d: "M4 20h16M8.6 20V5.4h9M8.6 5.4 5.2 9M17.6 5.4V10", class: "s" }],

    de_boulder:  { accent: "#a38a6c", g: [["path", { d: "M3 19.6l5.6-9 3.4 4.4 3-3.9 6 8.5z", class: "s" }],
                                          ["circle", { cx: 17, cy: 6.4, r: 1.7, class: "f" }]] },
    de_fachwerk: { accent: "#b07a5a", g: [["path", { d: "M4 20V9.6l8-5.6 8 5.6V20z", class: "s" }],
                                          ["path", { d: "M4 13.8h16M12 13.8V20", class: "s" }]] },

  // ---------- data ----------
  let PLAYERS = [{ steam64_id: "main", name: "", path: "." }];

  const ALL_QUEUES = [

    { id: "matchmaking_wingman", label: "Wingman" },

  const queueLabel = (id) => (ALL_QUEUES.find((q) => q.id === id) || { label: id }).label;

  const RANGES = [
    { id: "all", label: "All time", days: null },

    { id: "30", label: "Last 30 days", days: 30 },
  ];
  // `players` is the roster selection in click order: [0] is the player whose
  // own stats are shown, the rest narrow the view to lobbies they all shared.
  const state = {

    view: "player", party: "any", compareMetric: "winrate", compareShared: false,

  const primary = () => state.players[0];

  const playerName = (id) => {

  let MATCHES = [], HISTORY = [], QUEUES = [], latest = null, profile = null;
  const ARCHIVES = new Map();   // steam64_id -> { matches, history }

  // a new session starts after a >2h gap between match end times
  function prepare(matches) {
    matches.sort((a, b) => a.finished_at.localeCompare(b.finished_at));
    matches.forEach((m) => { m.date = new Date(m.finished_at); });
    let session = 0, prev = null;
    for (const m of matches) {
      if (prev && m.date - prev > 2 * 3600e3) session += 1;
      m.session = session;
      prev = m.date;
    }
    const counts = {};
    for (const m of matches) {
      counts[m.session] = (counts[m.session] || 0) + 1;
      m.gameInSession = counts[m.session];
    }
    return matches;
  }

  async function fetchArchive(entry) {
    if (ARCHIVES.has(entry.steam64_id)) return ARCHIVES.get(entry.steam64_id);
    const base = "data/" + (entry.path === "." || !entry.path ? "" : entry.path + "/");
    const [matches, history] = await Promise.all([
      fetch(base + "matches.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch(base + "profile_history.json").then((r) => (r.ok ? r.json() : [])),
    ]);
    const rec = { entry, matches: prepare(matches), history };
    ARCHIVES.set(entry.steam64_id, rec);
    return rec;
  }

  async function loadPlayer(entry) {
    let rec;
    try {
      rec = await fetchArchive(entry);
    } catch (e) {
      $("status").hidden = false;
      $("status").textContent = `Could not load this player's matches.json — if you opened this file directly, serve it over HTTP (python3 -m http.server).`;
      return false;
    }
    MATCHES = rec.matches;
    HISTORY = rec.history;
    QUEUES = ALL_QUEUES.filter((q) => q.id === "all" || MATCHES.some((m) => m.data_source === q.id));
    if (!QUEUES.some((q) => q.id === state.queue)) state.queue = "all";
    latest = MATCHES.length ? MATCHES[MATCHES.length - 1].date : new Date();
    profile = HISTORY.length ? HISTORY[HISTORY.length - 1] : null;
    if (!MATCHES.some((m) => (m.party || []).includes(state.party))) state.party = "any";

    const d = (x) => x.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    let sub = `${MATCHES.length} matches archived`;
    if (MATCHES.length) sub += ` · ${d(MATCHES[0].date)} – ${d(latest)}`;
    if (profile) {
      const r = profile.ranks || {};
      const bits = [];
      if (r.premier) bits.push(`Premier ${r.premier.toLocaleString("en-US")}`);
      if (r.faceit) bits.push(`Faceit ${r.faceit}` + (r.faceit_elo ? ` (${r.faceit_elo} elo)` : ""));
      if (r.leetify != null) bits.push(`Leetify rank ${r.leetify}`);
      if (bits.length) sub += " · " + bits.join(" · ");
    }
    $("subtitle").textContent = sub;
    return true;
  }

  // ---------- tooltip ----------
  const tt = $("tooltip");
  function showTip(evt, title, rows) {
    tt.replaceChildren();
    if (title) tt.append(el("div", { class: "tt-title" }, title));
    for (const r of rows) {
      const row = el("div", { class: "tt-row" });
      if (r.color) { const k = el("span", { class: "tt-key" }); k.style.background = r.color; row.append(k); }
      row.append(el("span", { class: "tt-val" }, r.value), el("span", { class: "tt-lab" }, r.label || ""));
      tt.append(row);
    }
    tt.hidden = false;

  }
  function moveTip(evt) {
    const pad = 14;
    let x = evt.clientX + pad, y = evt.clientY + pad;

    if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - pad;
    if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - pad;

  const seriesColor = (cls) => getComputedStyle(document.body).getPropertyValue(
    { s1: "--series-1", s2: "--series-2", pos: "--pos", neg: "--neg", demph: "--demph" }[cls] || "--series-1").trim();

  // ---------- layout scaffolding ----------
  function section(title, subtitle, { mark = null, brand = null } = {}) {
    const grid = el("div", { class: "grid" });
    const head = el("div", { class: "shead" });
    if (mark) head.append(markEl(mark, 28));
    head.append(el("h2", {}, title));
    if (brand) head.append(brand);
    const sec = el("section", { class: "sect" }, head, el("p", { class: "ssub" }, subtitle || ""));
    sec.append(grid);
    return { sec, grid, before: (node) => sec.insertBefore(node, grid) };
  }

  function card(title, subtitle, { wide = false, mark = null, brand = null } = {}) {
    const body = el("div", { class: "cbody" });
    const tableWrap = el("div", { class: "datatable" });

      const open = tableWrap.classList.toggle("open");
      btn.setAttribute("aria-expanded", String(open));

    return {
      fig, body,
      setTable(headers, rows) {
        tableWrap.replaceChildren();
        const table = el("table");
        const tr = el("tr");
        headers.forEach((h) => tr.append(el("th", {}, h)));
        table.append(el("thead", {}, tr));
        const tb = el("tbody");
        rows.forEach((r) => {
          const tr2 = el("tr");
          r.forEach((c) => tr2.append(el("td", {}, String(c))));

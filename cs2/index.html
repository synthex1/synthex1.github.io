  // chart geometry — viewBox units render ~1:1 at these card widths
  const CW = 620;        // standard card chart width
  const CWW = 1290;      // full-bleed card chart width

  // ---------- line chart (single series, crosshair tooltip) ----------
  function lineChart(container, pts, { fmt = fmt1, baseline = null, height = 250 } = {}) {
    container.replaceChildren();
    if (pts.length < 2) { container.append(el("p", { class: "csub" }, "Not enough matches in this slice.")); return; }
    const W = CW, H = height, m = { t: 16, r: 18, b: 34, l: 58 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const xs = pts.map((p) => p.x.getTime());
    const ys = pts.map((p) => p.y);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    let y0 = Math.min(...ys), y1 = Math.max(...ys);
    if (baseline != null) { y0 = Math.min(y0, baseline); y1 = Math.max(y1, baseline); }
    const span = (y1 - y0) || 1; y0 -= span * 0.12; y1 += span * 0.12;
    const X = (t) => m.l + ((t - x0) / (x1 - x0 || 1)) * iw;
    const Y = (v) => m.t + (1 - (v - y0) / (y1 - y0)) * ih;

    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
    for (const v of niceTicks(y0, y1, 4)) {
      s.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: "gridline" }));
      const t = svg("text", { x: m.l - 10, y: Y(v) + 5, "text-anchor": "end", class: "val" });
      t.textContent = fmt(v); s.append(t);
    }
    if (baseline != null && baseline >= y0 && baseline <= y1)
      s.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(baseline), y2: Y(baseline), class: "axisline" }));
    const months = dateTicks(x0, x1, 4);
    const longSpan = (x1 - x0) > 300 * 86400e3;
    months.forEach((d, i) => {
      const anchor = i === 0 ? "start" : i === months.length - 1 ? "end" : "middle";
      const t = svg("text", { x: X(d.getTime()), y: H - 10, "text-anchor": anchor });
      t.textContent = longSpan
        ? d.toLocaleDateString("en-GB", { month: "short", year: "numeric" })
        : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      s.append(t);
    });
    const dAttr = pts.map((p, i) => (i ? "L" : "M") + X(p.x.getTime()).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
    s.append(svg("path", { d: dAttr, fill: "none", class: "s1s", "stroke-width": 2.4, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = pts[pts.length - 1];
    s.append(svg("circle", { cx: X(last.x.getTime()), cy: Y(last.y), r: 5, class: "s1 ring" }));
    let labY = Y(last.y) - 12;
    if (labY < m.t + 12) labY = Y(last.y) + 24;
    const endLab = svg("text", { x: X(last.x.getTime()) - 8, y: labY, "text-anchor": "end", class: "val emph" });
    endLab.textContent = fmt(last.y); s.append(endLab);

    const cross = svg("line", { y1: m.t, y2: m.t + ih, class: "crosshair", visibility: "hidden" });
    const dot = svg("circle", { r: 5, class: "s1 ring", visibility: "hidden" });
    s.append(cross, dot);
    const overlay = svg("rect", { x: m.l, y: m.t, width: iw, height: ih, class: "hit", tabindex: 0 });
    function nearest(px) {
      let best = 0, bd = Infinity;
      pts.forEach((p, i) => { const d = Math.abs(X(p.x.getTime()) - px); if (d < bd) { bd = d; best = i; } });
      return best;
    }
    overlay.addEventListener("pointermove", (evt) => {
      const box = s.getBoundingClientRect();
      const px = ((evt.clientX - box.left) / box.width) * W;
      const i = nearest(px);
      const p = pts[i];
      cross.setAttribute("x1", X(p.x.getTime())); cross.setAttribute("x2", X(p.x.getTime()));
      cross.setAttribute("visibility", "visible");
      dot.setAttribute("cx", X(p.x.getTime())); dot.setAttribute("cy", Y(p.y));
      dot.setAttribute("visibility", "visible");
      showTip(evt, p.x.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }),
        [{ color: seriesColor("s1"), value: fmt(p.y), label: p.label || "" }]);
    });
    overlay.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); hideTip(); });
    s.append(overlay);
    container.append(s);
  }

  function niceTicks(lo, hi, n) {
    const span = hi - lo, step0 = span / n;
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((s) => s * mag).find((s) => span / s <= n + 1) || mag * 10;
    const start = Math.ceil(lo / step) * step;
    const out = [];
    for (let v = start; v <= hi + 1e-9; v += step) out.push(Math.round(v * 1e6) / 1e6);
    return out;
  }
  function dateTicks(t0, t1, n) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(new Date(t0 + ((t1 - t0) * i) / (n - 1 || 1)));
    return out;
  }

  // Diverging scales stay anchored at zero but only span the side(s) the data
  // actually uses, so an all-positive series doesn't waste half the panel.
  function zeroAnchoredRange(values) {
    const lo = Math.min(0, ...values), hi = Math.max(0, ...values);
    const pad = ((hi - lo) || 1) * 0.06;
    return [lo < 0 ? lo - pad : 0, hi > 0 ? hi + pad : 0];
  }

  // ---------- horizontal bars ----------
  function hBars(container, items, { fmt = fmt1, diverging = false, max = null, labelW = 150, width = CW } = {}) {
    container.replaceChildren();
    if (!items.length) { container.append(el("p", { class: "csub" }, "No data in this slice.")); return; }
    const W = width, rowH = 38, m = { t: 8, r: 78, b: 8, l: labelW };
    const H = m.t + m.b + rowH * items.length;
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
    const iw = W - m.l - m.r;
    let lo = 0, hi = max != null ? max : Math.max(...items.map((i) => i.value));
    if (diverging) [lo, hi] = zeroAnchoredRange(items.map((i) => i.value));
    const X = (v) => m.l + ((v - lo) / (hi - lo || 1)) * iw;
    if (diverging) s.append(svg("line", { x1: X(0), x2: X(0), y1: m.t, y2: H - m.b, class: "axisline" }));
    const barH = 22;
    items.forEach((it, i) => {
      const y = m.t + i * rowH + (rowH - barH) / 2;
      let tx = m.l - 12;
      if (it.mark) { s.append(markGroup(it.mark, 2, y - 1, 24)); tx = 32; }
      const lab = svg("text", { x: tx, y: y + barH / 2 + 5, "text-anchor": it.mark ? "start" : "end", class: "val" });
      lab.textContent = it.label; s.append(lab);
      const v0 = diverging ? Math.min(X(0), X(it.value)) : X(0);
      const w = Math.abs(X(it.value) - X(0));
      const cls = it.cls || (diverging ? (it.value >= 0 ? "pos" : "neg") : "s1");
      const positiveEnd = !diverging || it.value >= 0;
      s.append(svg("path", { d: roundedBar(v0, y, Math.max(w, 1), barH, positiveEnd), class: cls + " hoverable" + (it.faded ? " faded" : "") }));
      const vx = positiveEnd ? v0 + w + 10 : X(0) + 10;
      const vt = svg("text", { x: vx, y: y + barH / 2 + 5, "text-anchor": "start", class: "val" });
      vt.textContent = fmt(it.value); s.append(vt);
      const hit = svg("rect", { x: 0, y: m.t + i * rowH, width: W, height: rowH, class: "hit", tabindex: 0 });
      const tip = (evt) => showTip(evt, it.tipTitle || it.label, (it.tip || [{ value: fmt(it.value), label: "" }]).map((r) => ({ ...r, color: r.color || seriesColor(cls) })));
      hit.addEventListener("pointermove", tip);
      hit.addEventListener("focus", (e) => tip({ clientX: 200, clientY: e.target.getBoundingClientRect().top }));
      hit.addEventListener("pointerleave", hideTip);
      hit.addEventListener("blur", hideTip);
      s.append(hit);
    });
    container.append(s);
  }
  // rounded data-end, square baseline end
  function roundedBar(x, y, w, h, roundRight) {
    const r = Math.min(5, w);
    if (roundRight)
      return `M${x} ${y} h${w - r} a${r} ${r} 0 0 1 ${r} ${r} v${h - 2 * r} a${r} ${r} 0 0 1 -${r} ${r} h-${w - r} Z`;
    return `M${x + w} ${y} h-${w - r} a${r} ${r} 0 0 0 -${r} ${r} v${h - 2 * r} a${r} ${r} 0 0 0 ${r} ${r} h${w - r} Z`;
  }
  function roundedCol(x, y, w, h) {
    const r = Math.min(5, h, w / 2);
    return `M${x} ${y + h} v-${h - r} a${r} ${r} 0 0 1 ${r} -${r} h${w - 2 * r} a${r} ${r} 0 0 1 ${r} ${r} v${h - r} Z`;
  }

  // ---------- vertical columns ----------
  function vCols(container, items, { fmt = fmt1, diverging = false, height = 250, width = CW } = {}) {
    container.replaceChildren();
    if (!items.length) { container.append(el("p", { class: "csub" }, "No data in this slice.")); return; }
    const hasMarks = items.some((i) => i.mark);
    const hasSubs = items.some((i) => i.sub);
    // room for the mark, the label, its sub-label, and a value label hanging
    // below a negative column
    const labelBand = 22 + (hasMarks ? 30 : 0) + (hasSubs ? 20 : 0);
    const W = width, H = height, m = { t: 26, r: 18, b: labelBand + (diverging ? 26 : 8), l: 58 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
    let lo = 0, hi = Math.max(...items.map((i) => i.value));
    if (diverging) [lo, hi] = zeroAnchoredRange(items.map((i) => i.value));
    if (hi === lo) hi = lo + 1;
    const Y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * ih;
    const band = iw / items.length;
    const bw = Math.min(58, band - 16);
    const base = Y(diverging ? 0 : lo);
    s.append(svg("line", { x1: m.l, x2: W - m.r, y1: base, y2: base, class: "axisline" }));
    items.forEach((it, i) => {
      const cx = m.l + band * i + band / 2;
      const cls = it.cls || (diverging ? (it.value >= 0 ? "pos" : "neg") : "s1");
      const top = Y(Math.max(it.value, 0)), bot = Y(Math.min(it.value, 0));
      const h = Math.max(Math.abs(top - bot), 1);
      let d;
      if (!diverging || it.value >= 0) d = roundedCol(cx - bw / 2, top, bw, h);
      else {
        const r = Math.min(5, h, bw / 2);
        d = `M${cx - bw / 2} ${top} v${h - r} a${r} ${r} 0 0 0 ${r} ${r} h${bw - 2 * r} a${r} ${r} 0 0 0 ${r} -${r} v-${h - r} Z`;
      }
      s.append(svg("path", { d, class: cls + " hoverable" }));
      const labelTop = H - m.b + (diverging ? 26 : 8);   // first line of the label block
      if (it.mark) s.append(markGroup(it.mark, cx - 13, labelTop, 26));
      const lt = svg("text", { x: cx, y: labelTop + (hasMarks ? 30 : 0) + 15, "text-anchor": "middle" });
      lt.textContent = it.label; s.append(lt);
      if (it.sub) {
        const st = svg("text", { x: cx, y: labelTop + (hasMarks ? 30 : 0) + 33, "text-anchor": "middle", "font-size": 13 });
        st.textContent = it.sub; s.append(st);
      }
      const vt = svg("text", { x: cx, y: (it.value >= 0 ? top - 8 : bot + 18), "text-anchor": "middle", class: "val emph" });
      vt.textContent = fmt(it.value); s.append(vt);
      const hit = svg("rect", { x: m.l + band * i, y: m.t, width: band, height: ih, class: "hit", tabindex: 0 });
      const tip = (evt) => showTip(evt, it.tipTitle || it.label, (it.tip || [{ value: fmt(it.value), label: "" }]).map((r) => ({ ...r, color: r.color || seriesColor(cls) })));
      hit.addEventListener("pointermove", tip);
      hit.addEventListener("focus", (e) => tip({ clientX: 200, clientY: e.target.getBoundingClientRect().top }));
      hit.addEventListener("pointerleave", hideTip);
      hit.addEventListener("blur", hideTip);
      s.append(hit);
    });
    container.append(s);
  }

  // ---------- paired horizontal bars (two series per row) ----------
  function pairedBars(container, items, series, { fmt = fmt2, labelW = 168, width = CW } = {}) {
    container.replaceChildren();
    if (!items.length) { container.append(el("p", { class: "csub" }, "No data in this slice.")); return; }
    const W = width, rowH = 52, m = { t: 8, r: 62, b: 8, l: labelW };
    const H = m.t + m.b + rowH * items.length;
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
    const iw = W - m.l - m.r;
    const hi = Math.max(...items.flatMap((i) => [i.a, i.b])) || 1;
    const X = (v) => m.l + (v / hi) * iw;
    const barH = 17;
    items.forEach((it, i) => {
      const y0 = m.t + i * rowH + (rowH - barH * 2 - 5) / 2;
      const lab = svg("text", { x: m.l - 12, y: y0 + barH + 3, "text-anchor": "end", class: "val" });
      lab.textContent = it.label; s.append(lab);
      [["a", 0, series[0]], ["b", barH + 5, series[1]]].forEach(([key, dy, ser]) => {
        const w = Math.max(X(it[key]) - m.l, 1);
        s.append(svg("path", { d: roundedBar(m.l, y0 + dy, w, barH, true), class: ser.cls + " hoverable" }));
        const vt = svg("text", { x: m.l + w + 10, y: y0 + dy + barH - 4, "text-anchor": "start", class: "val" });
        vt.textContent = fmt(it[key]); s.append(vt);
      });
      const hit = svg("rect", { x: 0, y: m.t + i * rowH, width: W, height: rowH, class: "hit", tabindex: 0 });
      const tip = (evt) => showTip(evt, it.label, [
        { value: fmt(it.a), label: series[0].label, color: seriesColor(series[0].cls) },
        { value: fmt(it.b), label: series[1].label, color: seriesColor(series[1].cls) },
      ]);
      hit.addEventListener("pointermove", tip);
      hit.addEventListener("focus", (e) => tip({ clientX: 200, clientY: e.target.getBoundingClientRect().top }));
      hit.addEventListener("pointerleave", hideTip);
      hit.addEventListener("blur", hideTip);
      s.append(hit);
    });
    container.append(s);
  }

  // ---------- scatter ----------
  function scatter(container, pts, { xLabel, yLabel, xFmt = fmt2, yFmt = fmt2, height = 400, trend = true } = {}) {
    container.replaceChildren();
    if (pts.length < 3) { container.append(el("p", { class: "csub" }, "Not enough matches in this slice.")); return; }
    const W = CWW, H = height, m = { t: 16, r: 20, b: 52, l: 66 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
    let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const xs2 = (x1 - x0) || 1, ys2 = (y1 - y0) || 1;
    x0 -= xs2 * 0.05; x1 += xs2 * 0.05; y0 -= ys2 * 0.08; y1 += ys2 * 0.08;
    const X = (v) => m.l + ((v - x0) / (x1 - x0)) * iw;
    const Y = (v) => m.t + (1 - (v - y0) / (y1 - y0)) * ih;
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
    for (const v of niceTicks(y0, y1, 5)) {
      s.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: "gridline" }));
      const t = svg("text", { x: m.l - 10, y: Y(v) + 5, "text-anchor": "end", class: "val" });
      t.textContent = yFmt(v); s.append(t);
    }
    if (y0 < 0 && y1 > 0) s.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), class: "axisline" }));
    if (x0 < 0 && x1 > 0) s.append(svg("line", { x1: X(0), x2: X(0), y1: m.t, y2: m.t + ih, class: "axisline" }));
    for (const v of niceTicks(x0, x1, 7)) {
      const t = svg("text", { x: X(v), y: H - 28, "text-anchor": "middle", class: "val" });
      t.textContent = xFmt(v); s.append(t);
    }
    const xl = svg("text", { x: m.l + iw / 2, y: H - 6, "text-anchor": "middle", class: "axlab" });
    xl.textContent = xLabel; s.append(xl);
    const yl = svg("text", { x: 14, y: m.t + 4, "text-anchor": "start", class: "axlab" });
    yl.textContent = yLabel; s.append(yl);

    if (trend && pts.length >= 8) {                       // least-squares fit
      const mx = mean(xs), my = mean(ys);
      const den = xs.reduce((s2, v) => s2 + (v - mx) ** 2, 0);
      if (den > 0) {
        const b = xs.reduce((s2, v, i) => s2 + (v - mx) * (ys[i] - my), 0) / den;
        const fy = (v) => my + b * (v - mx);
        s.append(svg("line", {
          x1: X(x0), y1: Y(fy(x0)), x2: X(x1), y2: Y(fy(x1)),
          stroke: "var(--axis)", "stroke-width": 2, "stroke-dasharray": "7 5",
        }));
      }
    }
    for (const p of pts) s.append(svg("circle", { cx: X(p.x), cy: Y(p.y), r: 6, class: p.cls + " ring" }));
    for (const p of pts) {
      const hit = svg("circle", { cx: X(p.x), cy: Y(p.y), r: 14, class: "hit", tabindex: 0 });
      const tip = (evt) => showTip(evt, p.title, p.tip.map((r) => ({ ...r, color: r.color || seriesColor(p.cls) })));
      hit.addEventListener("pointermove", tip);
      hit.addEventListener("focus", (e) => tip({ clientX: 300, clientY: e.target.getBoundingClientRect().top }));
      hit.addEventListener("pointerleave", hideTip);
      hit.addEventListener("blur", hideTip);
      s.append(hit);
    }
    container.append(s);
  }

  // ---------- filters ----------
  function segButtons(node, options, key, onSelect) {
    node.replaceChildren();
    options.forEach((o) => {
      node.append(el("button", {
        class: "opt", "aria-pressed": String(state[key] === o.id),
        onclick: () => { state[key] = o.id; (onSelect || renderAll)(o); },
      }, o.label));
    });
  }

  // ---------- derived helpers ----------
  const rolling = (arr, w, acc) => arr.map((_, i) => {
    const lo = Math.max(0, i - w + 1);
    return mean(arr.slice(lo, i + 1).map(acc));
  });
  const MAPLABEL = (n) => (n || "").replace(/^(de|cs)_/, "").replace(/^\w/, (c) => c.toUpperCase());
  const winrate = (a) => mean(a.map((m) => (m.outcome === "win" ? 1 : m.outcome === "tie" ? 0.5 : 0)));

  function groupBy(ms, keyFn) {
    const g = new Map();
    for (const m of ms) {
      const k = keyFn(m);
      if (!g.has(k)) g.set(k, []);
      g.get(k).push(m);
    }
    return g;
  }

  function partyOk(m) {
    const party = m.party || [];
    // every co-selected player has to have been in the lobby
    if (!others().every((id) => party.includes(id))) return false;
    if (state.party === "solo" && state.players.length === 1) return party.length === 0;
    return true;
  }
  function filtered(matches = MATCHES, { party = true } = {}) {
    const r = RANGES.find((x) => x.id === state.range);
    const cutoff = r.days && latest ? new Date(latest.getTime() - r.days * 86400e3) : null;
    return matches.filter((m) =>
      (!cutoff || m.date >= cutoff) &&
      (state.queue === "all" || m.data_source === state.queue) &&
      (!party || partyOk(m)));
  }
  // tracked players who actually appear in this archive's parties, most-played first
  function partyMates(matches) {
    const c = new Map();
    for (const m of matches) for (const id of (m.party || [])) c.set(id, (c.get(id) || 0) + 1);
    return [...c].sort((a, b) => b[1] - a[1]);
  }

  function corr(a, b) {
    const p = a.map((v, i) => [v, b[i]]).filter(([x, y]) => x != null && y != null);
    if (p.length < 8) return null;
    const mx = mean(p.map((r) => r[0])), my = mean(p.map((r) => r[1]));
    const sx = Math.sqrt(p.reduce((s, r) => s + (r[0] - mx) ** 2, 0));
    const sy = Math.sqrt(p.reduce((s, r) => s + (r[1] - my) ** 2, 0));
    if (!sx || !sy) return null;
    return p.reduce((s, r) => s + (r[0] - mx) * (r[1] - my), 0) / (sx * sy);
  }

  // ---------- render ----------
  function renderAll() {
    const inPlayerView = state.view === "player";
    renderRoster();
    $("playerSeg").hidden = PLAYERS.length <= 1 || !inPlayerView;
    segButtons($("rangeSeg"), RANGES, "range");
    segButtons($("queueSeg"), QUEUES, "queue");
    if (PLAYERS.length > 1)
      segButtons($("viewSeg"), [{ id: "player", label: "One player" }, { id: "compare", label: "Compare" }], "view", switchView);
    else $("viewSeg").hidden = true;
    renderSoloToggle();
    $("filters").hidden = false;
    $("status").hidden = true;

    const root = $("sections");
    root.replaceChildren();
    if (!inPlayerView) { renderCompare(root); return; }

    const ms = filtered();
    const who = others().length
      ? `${ms.length} lobbies shared by ${[primary(), ...others()].map(playerName).join(", ")} · showing ${playerName(primary())}'s stats`
      : `${ms.length} matches in view`;
    $("filterNote").textContent = who;
    if (!ms.length) {
      $("kpis").replaceChildren();
      root.append(el("p", { class: "csub" },
        others().length
          ? "These players have no archived lobby in common under the current filters."
          : "No matches match the current filters."));
      return;
    }
    renderKpis(ms);

    if (others().length) renderHeadToHead(root, ms);
    renderForm(root, ms);
    renderMaps(root, ms);
    renderQueues(root, ms);
    renderMechanics(root, ms);
    renderSessions(root, ms);
    if (!others().length) renderSquad(root);
    renderLobby(root, ms);
  }

  // roster buttons are multi-select: the first click picks whose stats are
  // shown, further clicks narrow to lobbies those players shared
  function renderRoster() {
    const node = $("playerSeg");
    node.replaceChildren();
    if (PLAYERS.length <= 1) return;
    PLAYERS.forEach((p) => {
      const idx = state.players.indexOf(p.steam64_id);
      const b = el("button", {
        class: "opt" + (idx === 0 ? " lead" : ""),
        "aria-pressed": String(idx >= 0),
        title: idx === 0 ? "Stats shown are this player's — click another name to narrow to lobbies you shared"
                         : idx > 0 ? "Click to remove from the selection" : "Click to add: shows only lobbies you both played",
        onclick: () => togglePlayer(p.steam64_id),
      }, p.name || p.steam64_id);
      node.append(b);
    });
  }

  async function togglePlayer(id) {
    const idx = state.players.indexOf(id);
    if (idx === 0) {
      if (state.players.length === 1) return;      // the primary alone stays put
      state.players = [state.players[1], ...state.players.slice(2)];  // hand over the lead
    } else if (idx > 0) {
      state.players.splice(idx, 1);
    } else {
      state.players.push(id);
    }
    const root = $("sections");
    root.style.opacity = "0.45";
    const entries = state.players.map((pid) => PLAYERS.find((p) => p.steam64_id === pid)).filter(Boolean);
    await Promise.all(entries.map((e) => fetchArchive(e).catch(() => null)));
    if (await loadPlayer(entries[0])) renderAll();
    root.style.opacity = "";
  }

  function renderSoloToggle() {
    const wrap = $("partyWrap");
    wrap.replaceChildren();
    const soloGames = MATCHES.filter((m) => !(m.party || []).length).length;
    if (state.view !== "player" || state.players.length > 1 || !soloGames || soloGames === MATCHES.length) {
      wrap.hidden = true;
      if (state.party === "solo" && state.players.length > 1) state.party = "any";
      return;
    }
    wrap.hidden = false;
    wrap.append(el("button", {
      class: "tbtn", "aria-pressed": String(state.party === "solo"),
      onclick: () => { state.party = state.party === "solo" ? "any" : "solo"; renderAll(); },
    }, state.party === "solo" ? `Solo games only (${soloGames})` : `Solo games only`));
  }

  async function switchView(option) {
    if (option.id !== "compare") { renderAll(); return; }
    const root = $("sections");
    $("kpis").replaceChildren();
    root.replaceChildren(el("p", { class: "csub" }, "Loading every tracked player's archive…"));
    await Promise.all(PLAYERS.map((p) => fetchArchive(p).catch(() => null)));
    renderAll();
  }

  function renderKpis(ms) {
    const k = $("kpis");
    k.replaceChildren();
    const w = ms.filter((m) => m.outcome === "win").length;
    const l = ms.filter((m) => m.outcome === "loss").length;
    const t = ms.length - w - l;
    const kills = ms.reduce((s, m) => s + m.me.total_kills, 0);
    const deaths = ms.reduce((s, m) => s + m.me.total_deaths, 0);
    const half = Math.floor(ms.length / 2);
    const older = ms.slice(0, half), newer = ms.slice(half);
    const tiles = [
      { label: "Matches", value: String(ms.length) },
      { label: "Record", value: `${w}–${l}` + (t ? `–${t}` : ""), delta: ms.length ? fmtPct(w / ms.length) + " winrate" : null },
      { ...delta("Leetify rating", (a) => mean(a.map((m) => m.me.leetify_rating)), fmtRating, true), mark: LEETIFY_MARK },
      { label: "K/D", value: deaths ? fmt2(kills / deaths) : "–" },
      delta("ADR", (a) => mean(a.map((m) => m.me.dpr)), (v) => fmt1(v), true),
      delta("Headshot %", (a) => mean(a.map((m) => m.me.accuracy_head)), (v) => fmt1(v * 100) + "%", true),
    ];
    function delta(label, acc, f, upGood) {
      const cur = acc(ms), o = acc(older), n = acc(newer);
      const tile = { label, value: f(cur) };
      if (o != null && n != null && older.length >= 5) {
        const diff = n - o;
        tile.delta = (diff >= 0 ? "▲ " : "▼ ") + f(Math.abs(diff)).replace(/^\+/, "") + " newer vs older half";
        tile.deltaClass = diff === 0 ? "" : (diff > 0) === upGood ? "good" : "bad";
      }
      return tile;
    }
    tiles.forEach((tl) => {
      const lab = el("div", { class: "tlabel" });
      if (tl.mark) lab.append(markEl(tl.mark, 18));
      lab.append(el("span", {}, tl.label));
      const d = el("div", { class: "tile" }, lab, el("div", { class: "tvalue" }, tl.value));
      if (tl.delta) d.append(el("div", { class: "tdelta " + (tl.deltaClass || "") }, tl.delta));
      k.append(d);
    });
  }

  // ---------- form ----------
  function renderForm(root, ms) {
    const w = Math.min(20, Math.max(5, Math.floor(ms.length / 3)));
    const s = section("Form", `Rolling ${w}-game averages. The flat line is the break-even mark — zero rating, 50% winrate.`);

    const c1 = card("Leetify rating", `rolling ${w}-game average, ×100`, { mark: LEETIFY_MARK, brand: leetifyBrand() });
    const roll = rolling(ms, w, (m) => m.me.leetify_rating * 100);
    lineChart(c1.body, ms.map((m, i) => ({ x: m.date, y: roll[i], label: "rolling rating" })), { fmt: (v) => signed(v), baseline: 0 });
    c1.setTable(["Date", "Map", "Queue", "Result", "Score", "Rating", `Rolling ${w}`],
      ms.map((m, i) => [m.date.toLocaleDateString("en-GB"), MAPLABEL(m.map_name), queueLabel(m.data_source), m.outcome, `${m.score[0]}–${m.score[1]}`, fmtRating(m.me.leetify_rating), signed(roll[i])]));
    s.grid.append(c1.fig);

    const c2 = card("Winrate", `rolling ${w}-game average`);
    const rollW = rolling(ms, w, (m) => (m.outcome === "win" ? 1 : m.outcome === "tie" ? 0.5 : 0));
    lineChart(c2.body, ms.map((m, i) => ({ x: m.date, y: rollW[i] * 100, label: "rolling winrate" })), { fmt: (v) => fmt1(v) + "%", baseline: 50 });
    c2.setTable(["Date", "Result", `Rolling ${w} winrate`], ms.map((m, i) => [m.date.toLocaleDateString("en-GB"), m.outcome, fmt1(rollW[i] * 100) + "%"]));
    s.grid.append(c2.fig);
    root.append(s.sec);
  }

  // ---------- maps ----------
  function renderMaps(root, ms) {
    const MIN = 3;
    const all = [...groupBy(ms, (m) => m.map_name)].sort((a, b) => b[1].length - a[1].length);
    const groups = all.filter(([, a]) => a.length >= MIN);
    const small = all.filter(([, a]) => a.length < MIN);
    const overall = winrate(ms) * 100;

    const s = section("Maps", `Winrate on every map with at least ${MIN} games, against your ${fmt1(overall)}% overall. The tick on each meter is 50%.`);

    const cards = el("div", { class: "mapgrid" });
    for (const [name, a] of groups) {
      const wr = winrate(a) * 100;
      const mk = mapMark(name);
      const w = a.filter((m) => m.outcome === "win").length;
      const l = a.filter((m) => m.outcome === "loss").length;
      const t = a.length - w - l;
      const rating = mean(a.map((m) => m.me.leetify_rating));
      const fill = el("i");
      fill.style.width = Math.max(wr, 2) + "%";
      fill.style.background = wr >= 50 ? "var(--pos)" : "var(--neg)";
      const c = el("article", { class: "mapcard" },
        markEl(mk, 42),
        el("div", { class: "mname" }, MAPLABEL(name)),
        el("div", { class: "mmeta" }, `${a.length} games · ${w}–${l}${t ? `–${t}` : ""}`),
        el("div", { class: "mwr" }, el("b", {}, Math.round(wr) + "%"),
          el("span", {}, signed(wr - overall) + " pts vs overall")),
        el("div", { class: "meter" }, fill, el("u")),
        el("div", { class: "mrat" }, `${fmtRating(rating)} avg Leetify rating · ${fmt1(mean(a.map((m) => m.me.dpr)))} ADR`));
      c.style.borderColor = "color-mix(in srgb, " + mk.accent + " 34%, var(--border))";
      cards.append(c);
    }
    s.before(cards);
    if (small.length) s.before(el("p", { class: "smallmaps" },
      "Too few games to rate: " + small.map(([n, a]) => `${MAPLABEL(n)} (${a.length})`).join(", ")));

    const c2 = card("Your rating by map", "average Leetify rating — positive means you outperform the lobby", { mark: LEETIFY_MARK });
    hBars(c2.body, groups.map(([name, a]) => ({
      label: `${MAPLABEL(name)} (${a.length})`, value: mean(a.map((m) => m.me.leetify_rating)) * 100,
      mark: mapMark(name),
      tip: [{ value: fmtRating(mean(a.map((m) => m.me.leetify_rating))), label: "avg rating" },
            { value: fmt2(mean(a.map((m) => m.me.kd_ratio))), label: "avg K/D" },
            { value: fmt1(winrate(a) * 100) + "%", label: "winrate" }],
    })), { fmt: (v) => signed(v), diverging: true });
    c2.setTable(["Map", "Games", "Winrate", "Avg rating", "Avg K/D", "Avg ADR"], groups.map(([name, a]) => [
      MAPLABEL(name), a.length, fmt1(winrate(a) * 100) + "%", fmtRating(mean(a.map((m) => m.me.leetify_rating))),
      fmt2(mean(a.map((m) => m.me.kd_ratio))), fmt1(mean(a.map((m) => m.me.dpr)))]));
    s.grid.append(c2.fig);

    const c3 = card("Rounds won by map", "average round differential per game — how one-sided the map is for you");
    hBars(c3.body, groups.map(([name, a]) => ({
      label: `${MAPLABEL(name)} (${a.length})`, mark: mapMark(name),
      value: mean(a.map((m) => (m.score[0] || 0) - (m.score[1] || 0))),
      tip: [{ value: signed(mean(a.map((m) => (m.score[0] || 0) - (m.score[1] || 0)))), label: "avg round diff" },
            { value: fmt1(mean(a.map((m) => m.score[0] || 0))) + " – " + fmt1(mean(a.map((m) => m.score[1] || 0))), label: "avg score" }],
    })), { fmt: (v) => signed(v), diverging: true });
    c3.setTable(["Map", "Games", "Avg rounds for", "Avg rounds against", "Avg diff"], groups.map(([name, a]) => [
      MAPLABEL(name), a.length, fmt1(mean(a.map((m) => m.score[0] || 0))), fmt1(mean(a.map((m) => m.score[1] || 0))),
      signed(mean(a.map((m) => (m.score[0] || 0) - (m.score[1] || 0))))]));
    s.grid.append(c3.fig);
    root.append(s.sec);
  }

  // ---------- queues ----------
  function renderQueues(root, ms) {
    if (state.queue !== "all") return;
    const all = [...groupBy(ms, (m) => m.data_source)].sort((a, b) => b[1].length - a[1].length);
    const groups = all.filter(([, a]) => a.length >= 5);
    const tiny = all.filter(([, a]) => a.length < 5);
    if (groups.length < 2) return;
    const s = section("Queues", "Where the games come from, and how the results differ between them." +
      (tiny.length ? " Left out for sample size: " + tiny.map(([q, a]) => `${queueLabel(q)} (${a.length})`).join(", ") + "." : ""));
    const c = card("Winrate by queue", "bar height is winrate; hover for rating and K/D");
    vCols(c.body, groups.map(([q, a]) => ({
      label: queueLabel(q), sub: `${a.length} games`, mark: queueMark(q), value: winrate(a) * 100,
      tipTitle: queueLabel(q),
      tip: [{ value: fmt1(winrate(a) * 100) + "%", label: "winrate" },
            { value: fmtRating(mean(a.map((m) => m.me.leetify_rating))), label: "avg rating" },
            { value: fmt2(mean(a.map((m) => m.me.kd_ratio))), label: "avg K/D" }],
    })), { fmt: (v) => Math.round(v) + "%" });
    c.setTable(["Queue", "Games", "Winrate", "Avg rating", "Avg K/D", "Avg ADR"], groups.map(([q, a]) => [
      queueLabel(q), a.length, fmt1(winrate(a) * 100) + "%", fmtRating(mean(a.map((m) => m.me.leetify_rating))),
      fmt2(mean(a.map((m) => m.me.kd_ratio))), fmt1(mean(a.map((m) => m.me.dpr)))]));
    s.grid.append(c.fig);

    const c2 = card("Your rating by queue", "average Leetify rating in each queue", { mark: LEETIFY_MARK });
    vCols(c2.body, groups.map(([q, a]) => ({
      label: queueLabel(q), sub: `${a.length} games`, mark: queueMark(q),
      value: mean(a.map((m) => m.me.leetify_rating)) * 100, tipTitle: queueLabel(q),
      tip: [{ value: fmtRating(mean(a.map((m) => m.me.leetify_rating))), label: "avg rating" },
            { value: fmt1(mean(a.map((m) => m.me.dpr))), label: "ADR" }],
    })), { fmt: (v) => signed(v), diverging: true });
    c2.setTable(["Queue", "Games", "Avg rating", "Avg ADR", "Avg headshot %"], groups.map(([q, a]) => [
      queueLabel(q), a.length, fmtRating(mean(a.map((m) => m.me.leetify_rating))),
      fmt1(mean(a.map((m) => m.me.dpr))), fmt1(mean(a.map((m) => m.me.accuracy_head)) * 100) + "%"]));
    s.grid.append(c2.fig);
    root.append(s.sec);
  }

  // ---------- mechanics ----------
  function renderMechanics(root, ms) {
    const w = Math.min(10, Math.max(3, Math.floor(ms.length / 4)));
    const s = section("Your mechanics", `Rolling ${w}-game averages of the raw inputs Leetify measures for you.`);
    const defs = [
      { title: "Preaim", sub: "degrees off target when an enemy appears — lower is better", acc: (m) => m.me.preaim, fmt: fmt1 },
      { title: "Reaction time", sub: "milliseconds to react — lower is better", acc: (m) => m.me.reaction_time * 1000, fmt: (v) => fmt1(v) },
      { title: "Headshot accuracy", sub: "% of your kills that are headshots", acc: (m) => m.me.accuracy_head * 100, fmt: (v) => fmt1(v) + "%" },
      { title: "Counter-strafing", sub: "% of shots fired while properly stopped", acc: (m) => m.me.counter_strafing_shots_good_ratio * 100, fmt: (v) => fmt1(v) + "%" },
    ];
    for (const d of defs) {
      const c = card(d.title, d.sub);
      const roll = rolling(ms, w, d.acc);
      lineChart(c.body, ms.map((m, i) => ({ x: m.date, y: roll[i] })), { fmt: d.fmt, height: 220 });
      c.setTable(["Date", "Value", `Rolling ${w}`], ms.map((m, i) => [m.date.toLocaleDateString("en-GB"), d.fmt(d.acc(m)), d.fmt(roll[i])]));
      s.grid.append(c.fig);
    }
    root.append(s.sec);
  }

  // ---------- sessions ----------
  function renderSessions(root, ms) {
    const buckets = [[1, "1st"], [2, "2nd"], [3, "3rd"], [4, "4th"], [5, "5th+"]];
    const s = section("Sessions", "Sessions split on breaks of 2 hours or more — does your form fade the longer you play?");
    const items = buckets.map(([n, label]) => {
      const a = ms.filter((m) => (n < 5 ? m.gameInSession === n : m.gameInSession >= 5));
      if (!a.length) return null;
      return {
        label, sub: `${a.length} games`, value: mean(a.map((m) => m.me.leetify_rating)) * 100,
        tipTitle: `${label} game of a session`,
        tip: [{ value: fmtRating(mean(a.map((m) => m.me.leetify_rating))), label: "avg rating" },
              { value: fmt1(winrate(a) * 100) + "%", label: "winrate" }],
      };
    }).filter(Boolean);
    const c = card("Rating by game number in a session", "average Leetify rating", { mark: LEETIFY_MARK });
    vCols(c.body, items, { fmt: (v) => signed(v), diverging: true });
    c.setTable(["Game in session", "Matches", "Avg rating", "Winrate"], buckets.map(([n, label]) => {
      const a = ms.filter((m) => (n < 5 ? m.gameInSession === n : m.gameInSession >= 5));
      return [label, a.length, a.length ? fmtRating(mean(a.map((m) => m.me.leetify_rating))) : "–", a.length ? fmt1(winrate(a) * 100) + "%" : "–"];
    }));
    s.grid.append(c.fig);

    const c2 = card("Winrate by game number in a session", "same buckets, results instead of rating");
    vCols(c2.body, buckets.map(([n, label]) => {
      const a = ms.filter((m) => (n < 5 ? m.gameInSession === n : m.gameInSession >= 5));
      if (!a.length) return null;
      return { label, sub: `${a.length} games`, value: winrate(a) * 100, tipTitle: `${label} game of a session`,
        tip: [{ value: fmt1(winrate(a) * 100) + "%", label: "winrate" }] };
    }).filter(Boolean), { fmt: (v) => Math.round(v) + "%" });
    c2.setTable(["Game in session", "Matches", "Winrate"], buckets.map(([n, label]) => {
      const a = ms.filter((m) => (n < 5 ? m.gameInSession === n : m.gameInSession >= 5));
      return [label, a.length, a.length ? fmt1(winrate(a) * 100) + "%" : "–"];
    }));
    s.grid.append(c2.fig);
    root.append(s.sec);
  }

  // ---------- who you queue with ----------
  const METRICS = [
    { id: "winrate", label: "Winrate", fmt: (v) => fmt1(v) + "%", acc: (a) => winrate(a) * 100, good: 1 },
    { id: "rating", label: "Leetify rating", fmt: (v) => signed(v, fmt2), acc: (a) => mean(a.map((m) => m.me.leetify_rating)) * 100, good: 1, diverging: true },
    { id: "kd", label: "K/D", fmt: fmt2, acc: (a) => { const k = a.reduce((s, m) => s + m.me.total_kills, 0), d = a.reduce((s, m) => s + m.me.total_deaths, 0); return d ? k / d : null; }, good: 1 },
    { id: "adr", label: "ADR", fmt: fmt1, acc: (a) => mean(a.map((m) => m.me.dpr)), good: 1 },
    { id: "hs", label: "Headshot %", fmt: (v) => fmt1(v) + "%", acc: (a) => mean(a.map((m) => m.me.accuracy_head)) * 100, good: 1 },
    { id: "preaim", label: "Preaim (°)", fmt: fmt1, acc: (a) => mean(a.map((m) => m.me.preaim)), good: -1 },
    { id: "reaction", label: "Reaction (ms)", fmt: (v) => Math.round(v) + "", acc: (a) => mean(a.map((m) => m.me.reaction_time)) * 1000, good: -1 },
    { id: "cstrafe", label: "Counter-strafing %", fmt: (v) => fmt1(v) + "%", acc: (a) => mean(a.map((m) => m.me.counter_strafing_shots_good_ratio)) * 100, good: 1 },
  ];

  function renderSquad(root) {
    const base = filtered(MATCHES, { party: false });
    const MIN = 5;
    const mates = partyMates(base).filter(([, n]) => n >= MIN);
    const solo = base.filter((m) => !(m.party || []).length);
    const grouped = base.filter((m) => (m.party || []).length);
    if (!mates.length || !solo.length) return;

    const s = section("Who you queue with",
      `Every match here knows which tracked players shared the lobby, so the same numbers can be split by who you were queued with. ` +
      `Needs at least ${MIN} games together to appear.`);

    // headline — solo vs grouped
    const c0 = card("Solo queue vs queueing with the group", "your results when nobody else tracked here was on your team, versus when someone was");
    vCols(c0.body, [
      { label: "On your own", sub: `${solo.length} games`, value: winrate(solo) * 100, cls: "demph",
        tip: [{ value: fmt1(winrate(solo) * 100) + "%", label: "winrate" }, { value: fmtRating(mean(solo.map((m) => m.me.leetify_rating))), label: "avg rating" }] },
      { label: "With the group", sub: `${grouped.length} games`, value: winrate(grouped) * 100,
        tip: [{ value: fmt1(winrate(grouped) * 100) + "%", label: "winrate" }, { value: fmtRating(mean(grouped.map((m) => m.me.leetify_rating))), label: "avg rating" }] },
    ], { fmt: (v) => Math.round(v) + "%" });
    c0.setTable(["Split", "Matches", "Winrate", "Avg rating", "Avg K/D", "Avg ADR"], [["On your own", solo], ["With the group", grouped]].map(([l, a]) => [
      l, a.length, fmt1(winrate(a) * 100) + "%", fmtRating(mean(a.map((m) => m.me.leetify_rating))),
      fmt2(mean(a.map((m) => m.me.kd_ratio))), fmt1(mean(a.map((m) => m.me.dpr)))]));
    s.grid.append(c0.fig);

    // winrate by how many of the group are in the lobby
    const sizes = [0, 1, 2, 3, 4].map((n) => [n, base.filter((m) => (m.party || []).length === (n === 4 ? 4 : n) || (n === 4 && (m.party || []).length >= 4))])
      .map(([n, a]) => [n, a]).filter(([, a]) => a.length >= 3);
    if (sizes.length >= 2) {
      const c1 = card("Winrate by how many of you are queued", "0 means solo; larger parties mean more of the tracked group on your team");
      vCols(c1.body, sizes.map(([n, a]) => ({
        label: n === 0 ? "Solo" : `+${n}`, sub: `${a.length} games`, value: winrate(a) * 100,
        tipTitle: n === 0 ? "Queued alone" : `Queued with ${n} of the group`,
        tip: [{ value: fmt1(winrate(a) * 100) + "%", label: "winrate" },
              { value: fmtRating(mean(a.map((m) => m.me.leetify_rating))), label: "your avg rating" }],
      })), { fmt: (v) => Math.round(v) + "%" });
      c1.setTable(["Party", "Matches", "Winrate", "Avg rating"], sizes.map(([n, a]) => [
        n === 0 ? "Solo" : `+${n}`, a.length, fmt1(winrate(a) * 100) + "%", fmtRating(mean(a.map((m) => m.me.leetify_rating)))]));
      s.grid.append(c1.fig);
    }

    // with vs without, per team-mate — plotted as the difference, because the
    // absolute bars sit so close together that the gap is the only readable part
    for (const met of [METRICS[0], METRICS[1]]) {
      const unit = met.id === "winrate" ? " pts" : "";
      const c = card(`${met.label}: with them versus without them`,
        `the change in your own ${met.label.toLowerCase()} when they are in the lobby — right of the line is better with them`);
      const rows = mates.map(([id, n]) => {
        const withThem = base.filter((m) => (m.party || []).includes(id));
        const without = base.filter((m) => !(m.party || []).includes(id));
        return { id, n, withThem, without, a: met.acc(withThem), b: met.acc(without) };
      }).filter((r) => r.a != null && r.b != null).sort((x, y) => (y.a - y.b) - (x.a - x.b));
      hBars(c.body, rows.map((r) => ({
        label: `${playerName(r.id)} (${r.n})`, value: r.a - r.b, tipTitle: playerName(r.id),
        tip: [{ value: met.fmt(r.a), label: `with them (${r.withThem.length} games)` },
              { value: met.fmt(r.b), label: `without them (${r.without.length} games)` },
              { value: signed(r.a - r.b, fmt1) + unit, label: "difference" }],
      })), { fmt: (v) => signed(v, fmt1) + unit, diverging: true, labelW: 210 });
      c.setTable(["Player", "Games together", `${met.label} together`, `${met.label} apart`, "Difference"],
        rows.map((r) => [playerName(r.id), r.withThem.length, met.fmt(r.a), met.fmt(r.b), signed(r.a - r.b, fmt1) + unit]));
      s.grid.append(c.fig);
    }
    s.before(el("p", { class: "csub" },
      "Read these as association, not cause. You play different queues and different nights with different people, and a 30-game split " +
      "swings by several points on luck alone."));
    root.append(s.sec);
  }

  // ---------- head to head, inside the shared lobbies ----------
  // Same games, same opponents, same rounds — the only comparison between two
  // players that isn't confounded by them playing different lobbies.
  function renderHeadToHead(root, ms) {
    const ids = [primary(), ...others()];
    const sharedIds = new Set(ms.map((m) => m.id));
    const cols = ids.map((id) => {
      const rec = ARCHIVES.get(id);
      const rows = rec ? rec.matches.filter((m) => sharedIds.has(m.id)) : [];
      return { id, name: playerName(id), rows };
    }).filter((c) => c.rows.length);
    if (cols.length < 2) {
      const s = section("Head to head", "Could not line these players up on the same matches — one of their archives is missing these games.");
      root.append(s.sec);
      return;
    }
    const covered = Math.min(...cols.map((c) => c.rows.length));
    const s = section("Head to head",
      `The ${covered} lobbies these players shared, scored per player. Same games, same opponents, same rounds — ` +
      `so the differences are between the players, not between the games they happened to get.`);

    // shared team result, stated once: it is identical for everyone on the team
    const w = ms.filter((m) => m.outcome === "win").length;
    const l = ms.filter((m) => m.outcome === "loss").length;
    s.before(el("p", { class: "csub" },
      `Together they are ${w}–${l}${ms.length - w - l ? `–${ms.length - w - l}` : ""} (${fmt1(winrate(ms) * 100)}% winrate). ` +
      `Winrate is a team result, so it is the same for all of them — only the individual numbers below differ.`));

    const indiv = METRICS.filter((m) => m.id !== "winrate");
    const controls = el("div", { class: "cmpbar" });
    const sel = el("select", { class: "psel", "aria-label": "Metric",
      onchange: (e) => { state.h2hMetric = e.target.value; renderAll(); } });
    for (const m of indiv) {
      const o = el("option", { value: m.id }, m.label);
      if (m.id === state.h2hMetric) o.selected = true;
      sel.append(o);
    }
    controls.append(el("span", { class: "flabel" }, "Metric"), sel);
    s.before(controls);
    if (!indiv.some((m) => m.id === state.h2hMetric)) state.h2hMetric = "rating";

    const met = indiv.find((m) => m.id === state.h2hMetric) || indiv[0];
    const c1 = card(met.label + " in these games", "each player measured only on the lobbies they all played",
      { mark: met.id === "rating" ? LEETIFY_MARK : null });
    const vals = cols.map((c) => ({ ...c, v: met.acc(c.rows) })).filter((c) => c.v != null)
      .sort((a, b) => (met.good > 0 ? b.v - a.v : a.v - b.v));
    const floor = met.diverging ? 0 : Math.min(...vals.map((v) => v.v)) * 0.85;
    hBars(c1.body, vals.map((c) => ({
      label: c.name, value: met.diverging ? c.v : c.v - floor,
      cls: c.id === primary() ? "s1" : "demph",
      tipTitle: c.name,
      tip: [{ value: met.fmt(c.v), label: met.label.toLowerCase() },
            { value: String(c.rows.length), label: "shared games" }],
    })), { fmt: (v) => met.fmt(met.diverging ? v : v + floor), diverging: !!met.diverging, labelW: 190 });
    if (!met.diverging) c1.body.append(el("p", { class: "csub" },
      "Bars start below the lowest value so the gaps are visible — read the labels, not the lengths."));
    c1.setTable(["Player", "Shared games", met.label], vals.map((c) => [c.name, c.rows.length, met.fmt(c.v)]));
    s.grid.append(c1.fig);

    // how often each of them was the best of the group on the night
    const byId = new Map(cols.map((c) => [c.id, new Map(c.rows.map((m) => [m.id, m]))]));
    const tally = new Map(cols.map((c) => [c.id, 0]));
    let judged = 0;
    for (const m of ms) {
      const scored = cols.map((c) => ({ id: c.id, r: (byId.get(c.id).get(m.id) || {}).me }))
        .filter((x) => x.r && x.r.leetify_rating != null);
      if (scored.length < 2) continue;
      judged++;
      const best = scored.reduce((a, b) => (b.r.leetify_rating > a.r.leetify_rating ? b : a));
      tally.set(best.id, tally.get(best.id) + 1);
    }
    if (judged >= 5) {
      const c3 = card("Who topped the group", `highest Leetify rating of the selected players, counted over ${judged} shared games`);
      hBars(c3.body, cols.map((c) => ({
        label: c.name, value: (tally.get(c.id) / judged) * 100, cls: c.id === primary() ? "s1" : "demph",
        tipTitle: c.name,
        tip: [{ value: `${tally.get(c.id)} of ${judged}`, label: "games topped" },
              { value: fmt1((tally.get(c.id) / judged) * 100) + "%", label: "share" }],
      })).sort((a, b) => b.value - a.value), { fmt: (v) => Math.round(v) + "%", max: 100, labelW: 190 });
      c3.setTable(["Player", "Games topped", "Share"], cols.map((c) => [
        c.name, `${tally.get(c.id)} of ${judged}`, fmt1((tally.get(c.id) / judged) * 100) + "%"]));
      s.grid.append(c3.fig);
    }

    // who contributes what, across every metric at once
    const c2 = card("Every metric, same lobbies", "the leader in each row is highlighted", { wide: true });
    const table = el("table");
    const hr = el("tr");
    ["Metric", ...cols.map((c) => c.name + (c.id === primary() ? " ★" : ""))].forEach((h) => hr.append(el("th", {}, h)));
    table.append(el("thead", {}, hr));
    const tb = el("tbody");
    for (const m of indiv) {
      const tr = el("tr");
      tr.append(el("td", {}, m.label));
      const raw = cols.map((c) => m.acc(c.rows));
      const best = raw.reduce((b, v) => (v == null ? b : b == null ? v : (m.good > 0 ? Math.max(b, v) : Math.min(b, v))), null);
      raw.forEach((v) => {
        const td = el("td", {}, v == null ? "–" : m.fmt(v));
        if (v != null && v === best) td.className = "lead";
        tr.append(td);
      });
      tb.append(tr);
    }
    table.append(tb);
    c2.body.append(el("div", { class: "datatable open" }, table));
    c2.body.append(el("p", { class: "csub" }, "★ marks the player whose stats drive the rest of the page."));
    s.grid.append(c2.fig);
    root.append(s.sec);
  }

  // ---------- compare players ----------
  function renderCompare(root) {
    const loaded = PLAYERS.map((p) => ARCHIVES.get(p.steam64_id)).filter(Boolean);
    if (loaded.length < 2) { root.append(el("p", { class: "csub" }, "Need at least two loaded archives to compare.")); return; }

    // matches that appear in more than one archive are games the group shared
    const seen = new Map();
    for (const rec of loaded) for (const m of rec.matches) seen.set(m.id, (seen.get(m.id) || 0) + 1);
    const sharedIds = new Set([...seen].filter(([, n]) => n > 1).map(([id]) => id));

    const rows = loaded.map((rec) => {
      let ms = filtered(rec.matches, { party: false });
      if (state.compareShared) ms = ms.filter((m) => sharedIds.has(m.id));
      return { rec, name: rec.entry.name || rec.entry.steam64_id, ms };
    }).filter((r) => r.ms.length >= 3).sort((a, b) => b.ms.length - a.ms.length);

    $("filterNote").textContent = `${rows.length} players · ${rows.reduce((s, r) => s + r.ms.length, 0)} matches in view`;

    const s = section("Compare players",
      state.compareShared
        ? "Only lobbies that more than one tracked player was in — everyone measured on the same games."
        : "Each player over their own archive, under the same date and queue filters. The Leetify API only serves the last 100 matches, " +
          "so a recently added player starts at 100 and grows from there — compare rates, not totals.");

    const controls = el("div", { class: "cmpbar" });
    const sel = el("select", { class: "psel", "aria-label": "Metric",
      onchange: (e) => { state.compareMetric = e.target.value; renderAll(); } });
    for (const m of METRICS) {
      const o = el("option", { value: m.id }, m.label);
      if (m.id === state.compareMetric) o.selected = true;
      sel.append(o);
    }
    const toggle = el("button", { class: "tbtn", "aria-pressed": String(state.compareShared),
      onclick: () => { state.compareShared = !state.compareShared; renderAll(); } },
      state.compareShared ? "Showing shared lobbies only" : "Show shared lobbies only");
    controls.append(el("span", { class: "flabel" }, "Metric"), sel, toggle);
    s.before(controls);

    if (!rows.length) {
      s.before(el("p", { class: "csub" }, "No player has enough matches in this slice."));
      root.append(s.sec);
      return;
    }

    const met = METRICS.find((m) => m.id === state.compareMetric) || METRICS[0];
    const c = card(met.label, state.compareShared ? "measured only on lobbies the group shared" : "measured over each player's own matches");
    const vals = rows.map((r) => ({ name: r.name, n: r.ms.length, v: met.acc(r.ms) })).filter((r) => r.v != null)
      .sort((a, b) => (met.good > 0 ? b.v - a.v : a.v - b.v));
    const floor = met.diverging ? 0 : Math.min(...vals.map((v) => v.v)) * 0.82;
    hBars(c.body, vals.map((r) => ({
      label: `${r.name} (${r.n})`, value: met.diverging ? r.v : r.v - floor,
      tipTitle: r.name,
      tip: [{ value: met.fmt(r.v), label: met.label.toLowerCase() }, { value: String(r.n), label: "matches" }],
    })), { fmt: (v) => met.fmt(met.diverging ? v : v + floor), diverging: !!met.diverging, labelW: 190 });
    if (!met.diverging) c.body.append(el("p", { class: "csub" }, "Bars start at a shared baseline rather than zero, to make the gaps readable — read the labels, not the bar lengths."));
    c.setTable(["Player", "Matches", met.label], vals.map((r) => [r.name, r.n, met.fmt(r.v)]));
    s.grid.append(c.fig);

    const c2 = card("Everything side by side", "all tracked metrics, same filters", { wide: true });
    c2.body.append(el("div", { class: "datatable open" },
      (() => {
        const table = el("table");
        const tr = el("tr");
        ["Player", "Matches", ...METRICS.map((m) => m.label)].forEach((h) => tr.append(el("th", {}, h)));
        table.append(el("thead", {}, tr));
        const tb = el("tbody");
        for (const r of rows) {
          const tr2 = el("tr");
          tr2.append(el("td", {}, r.name), el("td", {}, String(r.ms.length)));
          for (const m of METRICS) {
            const v = m.acc(r.ms);
            tr2.append(el("td", {}, v == null ? "–" : m.fmt(v)));
          }
          tb.append(tr2);
        }
        table.append(tb);
        return table;
      })()));
    s.grid.append(c2.fig);
    root.append(s.sec);
  }

  // ================= lobby quality =================
  // Every factor is measured over the nine other players in the server, not
  // just the enemy five: when you win, enemy stats sag and teammate stats
  // rise, so averaging the whole server cancels most of that feedback.
  const PILLARS = [
    { key: "aim", label: "Aim & mechanics", cls: "s1" },
    { key: "util", label: "Utility & discipline", cls: "s2" },
    { key: "trade", label: "Structure & trading", cls: "pos" },
  ];
  const ratio = (L, a, b) => (L.sums[b] ? L.sums[a] / L.sums[b] : null);
  const pc = (v) => fmt1(v * 100) + "%";
  // `value` is the natural reading in its own units; `dir` says which way is
  // stronger, so the score can use it while the page can still show real numbers.
  const FACTORS = [
    { pillar: "aim", key: "preaim", label: "Crosshair placement", dir: -1, fmt: (v) => fmt1(v) + "°",
      hint: "degrees off target when an enemy appears",
      value: (L) => L.avgs.preaim, sample: (L) => L.sums.rounds_count },
    { pillar: "aim", key: "reaction", label: "Reaction time", dir: -1, fmt: (v) => Math.round(v * 1000) + " ms",
      hint: "how fast they shoot once they see you",
      value: (L) => L.avgs.reaction_time, sample: (L) => L.sums.rounds_count },
    { pillar: "aim", key: "cstrafe", label: "Counter-strafing", dir: 1, fmt: pc,
      hint: "shots fired while properly stopped",
      value: (L) => ratio(L, "counter_strafing_shots_good", "counter_strafing_shots_all"), sample: (L) => L.sums.counter_strafing_shots_all },
    { pillar: "aim", key: "accspot", label: "Accuracy on a visible enemy", dir: 1, fmt: pc,
      hint: "hits per shot with an enemy in view",
      value: (L) => ratio(L, "shots_hit_enemy_spotted", "shots_fired_enemy_spotted"), sample: (L) => L.sums.shots_fired_enemy_spotted },
    { pillar: "aim", key: "hsshare", label: "Headshot share", dir: 1, fmt: pc,
      hint: "share of their kills that are headshots",
      value: (L) => ratio(L, "total_hs_kills", "total_kills"), sample: (L) => L.sums.total_kills },
    { pillar: "aim", key: "spray", label: "Spray control", dir: 1, fmt: pc,
      hint: "accuracy on sustained fire",
      value: (L) => L.avgs.spray_accuracy, sample: (L) => L.sums.rounds_count },

    { pillar: "util", key: "utilrate", label: "Grenades thrown per round", dir: 1, fmt: (v) => fmt1(v),
      hint: "how much utility the server actually uses",
      value: (L) => (L.sums.rounds_count ? (L.sums.flashbang_thrown + L.sums.he_thrown + L.sums.smoke_thrown + L.sums.molotov_thrown) / L.sums.rounds_count : null),
      sample: (L) => L.sums.rounds_count },
    { pillar: "util", key: "flashhit", label: "Flashes that blind someone", dir: 1, fmt: pc,
      hint: "share of flashes that land on an enemy",
      value: (L) => ratio(L, "flashbang_hit_foe", "flashbang_thrown"), sample: (L) => L.sums.flashbang_thrown },
    { pillar: "util", key: "blind", label: "Blind time per flash", dir: 1, fmt: (v) => fmt1(v) + " s",
      hint: "how long their flashes blind for",
      value: (L) => L.avgs.flashbang_hit_foe_avg_duration, sample: (L) => L.sums.flashbang_hit_foe },
    { pillar: "util", key: "flashkill", label: "Flashes that set up a kill", dir: 1, fmt: pc,
      hint: "flashes converted into a kill",
      value: (L) => ratio(L, "flashbang_leading_to_kill", "flashbang_thrown"), sample: (L) => L.sums.flashbang_thrown },
    { pillar: "util", key: "teamflash", label: "Team-flashing", dir: -1, fmt: pc,
      hint: "flashes that blind their own side",
      value: (L) => ratio(L, "flashbang_hit_friend", "flashbang_thrown"), sample: (L) => L.sums.flashbang_thrown },
    { pillar: "util", key: "hedmg", label: "HE damage", dir: 1, fmt: (v) => fmt1(v),
      hint: "damage per grenade thrown",
      value: (L) => L.avgs.he_foes_damage_avg, sample: (L) => L.sums.he_thrown },
    { pillar: "util", key: "wasted", label: "Utility wasted on death", dir: -1, fmt: (v) => "$" + Math.round(v),
      hint: "value of nades still in hand when they die",
      value: (L) => L.avgs.utility_on_death_avg, sample: (L) => L.sums.rounds_count },

    { pillar: "trade", key: "tradeopp", label: "Trade situations per round", dir: 1, fmt: fmt2,
      hint: "how often they die within reach of a teammate",
      value: (L) => ratio(L, "traded_death_opportunities", "rounds_count"), sample: (L) => L.sums.rounds_count },
    { pillar: "trade", key: "tradeconv", label: "Trades taken", dir: 1, fmt: pc,
      hint: "trade kills won when the chance was there",
      value: (L) => ratio(L, "trade_kills_succeed", "trade_kill_attempts"), sample: (L) => L.sums.trade_kill_attempts },
    { pillar: "trade", key: "tradedconv", label: "Deaths that get avenged", dir: 1, fmt: pc,
      hint: "their team punishing a lost duel",
      value: (L) => ratio(L, "traded_deaths_succeed", "traded_death_attempts"), sample: (L) => L.sums.traded_death_attempts },
  ];

  function combineSides(a, b) {
    const n = (a.n || 0) + (b.n || 0);
    const avgs = {}, sums = {};
    for (const k of new Set([...Object.keys(a.avgs || {}), ...Object.keys(b.avgs || {})])) {
      const va = (a.avgs || {})[k], vb = (b.avgs || {})[k];
      avgs[k] = va == null ? vb : vb == null ? va : (va * a.n + vb * b.n) / n;
    }
    for (const k of new Set([...Object.keys(a.sums || {}), ...Object.keys(b.sums || {})]))
      sums[k] = ((a.sums || {})[k] || 0) + ((b.sums || {})[k] || 0);
    return { n, avgs, sums };
  }

  function standardize(vals) {
    const ok = vals.filter((v) => v != null && isFinite(v));
    if (ok.length < 3) return vals.map(() => null);
    const mu = mean(ok);
    const sd = Math.sqrt(mean(ok.map((v) => (v - mu) ** 2))) || 1;
    return vals.map((v) => (v == null || !isFinite(v) ? null : (v - mu) / sd));
  }
  // pull thin samples toward the average instead of letting them read as extremes
  function shrink(zs, samples) {
    const k = median(samples.filter((s) => s > 0)) || 1;
    return zs.map((z, i) => (z == null ? null : z * ((samples[i] || 0) / ((samples[i] || 0) + k))));
  }
  // remove whatever a factor owes to the match simply running long or short
  function residualize(vals, x) {
    const p = vals.map((v, i) => [v, x[i]]).filter(([v, t]) => v != null && t != null);
    if (p.length < 8) return vals;
    const mv = mean(p.map((r) => r[0])), mx = mean(p.map((r) => r[1]));
    const den = p.reduce((s, r) => s + (r[1] - mx) ** 2, 0);
    if (!den) return vals;
    const b = p.reduce((s, r) => s + (r[0] - mv) * (r[1] - mx), 0) / den;
    return vals.map((v, i) => (v == null || x[i] == null ? null : v - (mv + b * (x[i] - mx))));
  }

  function lobbyModel(ms) {
    const rows = ms.filter((m) => m.lobby && m.lobby.opponents && m.lobby.teammates &&
      m.lobby.opponents.sums && m.lobby.teammates.sums && m.lobby.opponents.n);
    if (rows.length < 15) return null;
    const rounds = rows.map((m) => m.lobby.rounds || null);
    const basis = {
      lobby: rows.map((m) => combineSides(m.lobby.teammates, m.lobby.opponents)),
      enemy: rows.map((m) => m.lobby.opponents),
    };
    const out = {};
    for (const [name, sides] of Object.entries(basis)) {
      const factors = {}, raw = {};
      for (const f of FACTORS) {
        raw[f.key] = sides.map(f.value);
        const signedVals = raw[f.key].map((v) => (v == null ? null : f.dir * v));
        factors[f.key] = standardize(residualize(shrink(standardize(signedVals), sides.map(f.sample)), rounds));
      }
      const pillars = {};
      for (const p of PILLARS) {
        const keys = FACTORS.filter((f) => f.pillar === p.key).map((f) => f.key);
        pillars[p.key] = standardize(rows.map((_, i) => {
          const v = keys.map((k) => factors[k][i]).filter((x) => x != null);
          return v.length ? mean(v) : null;
        }));
      }
      const composite = standardize(rows.map((_, i) => mean(PILLARS.map((p) => pillars[p.key][i] || 0))));
      out[name] = { factors, raw, pillars, composite };
    }
    // 0–100: how many of this player's own matches had a weaker server
    const order = out.lobby.composite.map((v, i) => [v, i]).filter(([v]) => v != null)
      .sort((a, b) => a[0] - b[0]);
    const score = new Array(rows.length).fill(null);
    order.forEach(([, i], rank) => { score[i] = order.length < 2 ? 50 : (rank / (order.length - 1)) * 100; });
    rows.forEach((m, i) => { m._lobbyZ = out.lobby.composite[i]; m._lobbyScore = score[i]; });
    return { rows, rounds, score, ...out.lobby, enemy: out.enemy };
  }

  function renderLobby(root, ms) {
    const model = lobbyModel(ms);
    const s = section("How hard were your lobbies?",
      "Every match is scored 0–100 on how strong the server was — 100 being the toughest lobby in this slice, 0 the softest. " +
      "The score is built only from how the other nine players performed, never from whether you won.");
    if (!model) {
      s.before(el("p", { class: "csub" }, "Not enough matches with full lobby detail in this slice."));
      root.append(s.sec);
      return;
    }
    const { rows, score } = model;
    const wins = rows.map((m) => (m.outcome === "win" ? 1 : m.outcome === "tie" ? 0.5 : 0));
    const idxBy = (test) => rows.map((_, i) => i).filter((i) => score[i] != null && test(score[i]));
    const easiest = idxBy((v) => v < 25), hardest = idxBy((v) => v >= 75);
    const wrOf = (idx) => (idx.length ? mean(idx.map((i) => wins[i])) * 100 : null);

    // --- headline ---
    const gap = wrOf(easiest) - wrOf(hardest);
    const strip = el("section", { class: "kpi-row" });
    [
      { label: "Softest quarter of lobbies", value: Math.round(wrOf(easiest)) + "%", sub: `winrate over ${easiest.length} games` },
      { label: "Toughest quarter of lobbies", value: Math.round(wrOf(hardest)) + "%", sub: `winrate over ${hardest.length} games` },
      { label: "What the difficulty costs you", value: signed(-gap) + " pts", sub: "winrate, toughest vs softest", cls: gap > 0 ? "bad" : "good" },
    ].forEach((t) => {
      strip.append(el("div", { class: "tile" },
        el("div", { class: "tlabel" }, el("span", {}, t.label)),
        el("div", { class: "tvalue" }, t.value),
        el("div", { class: "tdelta " + (t.cls || "") }, t.sub)));
    });
    s.before(strip);

    // --- what a hard lobby actually looks like, in real units ---
    const meanRaw = (key, idx) => {
      const v = idx.map((i) => model.raw[key][i]).filter((x) => x != null && isFinite(x));
      return v.length ? mean(v) : null;
    };
    const c0 = card("What a tough lobby actually looks like",
      "the real numbers the other nine players put up, in your softest quarter of games versus your toughest", { wide: true });
    const list = el("div", { class: "deltalist" });
    const deltas = FACTORS.map((f) => {
      const a = meanRaw(f.key, easiest), b = meanRaw(f.key, hardest);
      if (a == null || b == null || !a) return null;
      const relChange = ((b - a) / Math.abs(a)) * 100;
      return { f, a, b, relChange, better: Math.sign(b - a) === f.dir };
    }).filter(Boolean).sort((x, y) => Math.abs(y.relChange) - Math.abs(x.relChange));
    const widest = Math.max(...deltas.map((d) => Math.abs(d.relChange))) || 1;
    for (const d of deltas) {
      const bar = el("i");
      bar.style.width = (Math.abs(d.relChange) / widest) * 100 + "%";
      bar.style.background = d.better ? "var(--pos)" : "var(--demph)";
      list.append(el("div", { class: "drow" },
        el("div", { class: "dname" }, d.f.label, el("small", {}, d.f.hint)),
        el("div", { class: "dvals" },
          el("span", { class: "dfrom" }, d.f.fmt(d.a)),
          el("span", { class: "darrow" }, "→"),
          el("span", { class: "dto" + (d.better ? " up" : "") }, d.f.fmt(d.b))),
        el("div", { class: "dbar" }, bar),
        el("div", { class: "dpct" }, signed(d.relChange, (v) => Math.round(v) + "%"))));
    }
    c0.body.append(list);
    const rightWay = deltas.filter((d) => d.better).length;
    c0.body.append(el("p", { class: "csub" },
      `${rightWay} of the ${deltas.length} signals move in the direction of a better team, which is the basic check that the score is ` +
      `tracking something real. Bar length is the size of the change, not its importance — for that, see which signals actually cost you games below.`));
    c0.setTable(["Signal", "Softest quarter", "Toughest quarter", "Change"],
      deltas.map((d) => [d.f.label, d.f.fmt(d.a), d.f.fmt(d.b), signed(d.relChange, (v) => Math.round(v) + "%")]));
    s.grid.append(c0.fig);

    // --- winrate by difficulty band ---
    const BANDS = [["Softest quarter", 0, 25], ["Below average", 25, 50], ["Above average", 50, 75], ["Toughest quarter", 75, 101]];
    const bands = BANDS.map(([label, lo, hi]) => [label, rows.filter((m, i) => score[i] != null && score[i] >= lo && score[i] < hi)])
      .filter(([, a]) => a.length);
    const c2 = card("Your winrate as lobbies get harder", "matches split into four equal groups by lobby score");
    vCols(c2.body, bands.map(([label, a]) => ({
      label, sub: `${a.length} games`, value: winrate(a) * 100, tipTitle: label,
      tip: [{ value: fmt1(winrate(a) * 100) + "%", label: "winrate" },
            { value: fmtRating(mean(a.map((m) => m.me.leetify_rating))), label: "your avg rating" },
            { value: fmt2(mean(a.map((m) => m.me.kd_ratio))), label: "your avg K/D" }],
    })), { fmt: (v) => Math.round(v) + "%" });
    c2.setTable(["Band", "Matches", "Winrate", "Your avg rating", "Your avg K/D"], bands.map(([label, a]) => [
      label, a.length, fmt1(winrate(a) * 100) + "%", fmtRating(mean(a.map((m) => m.me.leetify_rating))),
      fmt2(mean(a.map((m) => m.me.kd_ratio)))]));
    s.grid.append(c2.fig);

    // --- scatter ---
    const c1 = card("Every match, plotted", "lobby score across the bottom, how well you played up the side", { wide: true, mark: LEETIFY_MARK });
    scatter(c1.body, rows.map((m, i) => ({
      x: score[i], y: m.me.leetify_rating * 100,
      cls: m.outcome === "win" ? "s1" : m.outcome === "loss" ? "s2" : "demph",
      title: `${MAPLABEL(m.map_name)} · ${queueLabel(m.data_source)} · ${m.date.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}`,
      tip: [
        { value: `${m.score[0]}–${m.score[1]}`, label: m.outcome },
        { value: fmtRating(m.me.leetify_rating), label: "your rating" },
        { value: Math.round(score[i]) + " / 100", label: "lobby score" },
        { value: (m.party || []).length ? (m.party || []).map(playerName).join(", ") : "solo queue", label: "" },
      ],
    })).filter((p) => p.x != null), {
      xLabel: "lobby score — 0 is the softest server in this slice, 100 the toughest",
      yLabel: "your Leetify rating", xFmt: (v) => Math.round(v) + "", yFmt: (v) => signed(v),
    });
    c1.legend([{ cls: "s1", label: "Win" }, { cls: "s2", label: "Loss" }, { cls: "demph", label: "Tie" }]);
    c1.setTable(["Date", "Map", "Queue", "Result", "Your rating", "Lobby score", "Aim", "Utility", "Trading"],
      rows.map((m, i) => [m.date.toLocaleDateString("en-GB"), MAPLABEL(m.map_name), queueLabel(m.data_source), m.outcome,
        fmtRating(m.me.leetify_rating), score[i] == null ? "–" : Math.round(score[i]), signed(model.pillars.aim[i], fmt2),
        signed(model.pillars.util[i], fmt2), signed(model.pillars.trade[i], fmt2)]));
    s.grid.append(c1.fig);

    // --- which signals actually bite ---
    const terc = (vals) => {
      const idx = vals.map((v, i) => [v, i]).filter(([v]) => v != null).sort((a, b) => a[0] - b[0]).map(([, i]) => i);
      const k = Math.floor(idx.length / 3);
      return [idx.slice(0, k), idx.slice(-k)];
    };
    const c4 = card("Which signals actually cost you games",
      `how many points of winrate you lose between the softest and toughest third of lobbies on each signal, over ${rows.length} matches`);
    const audit = FACTORS.map((f) => {
      const [lo, hi] = terc(model.factors[f.key]);
      if (!lo.length || !hi.length) return null;
      const g = (mean(lo.map((i) => wins[i])) - mean(hi.map((i) => wins[i]))) * 100;
      return { label: f.label, value: g, faded: g <= 0, tipTitle: f.label,
        tip: [{ value: signed(g) + " pts", label: "winrate lost" },
              { value: PILLARS.find((p) => p.key === f.pillar).label, label: "" },
              { value: f.hint, label: "" }] };
    }).filter(Boolean).sort((a, b) => b.value - a.value);
    hBars(c4.body, audit, { fmt: (v) => signed(v) + " pts", diverging: true, labelW: 230 });
    c4.body.append(el("p", { class: "csub" },
      "Faded bars are signals that describe the lobby but do not actually make it harder for you — pure aim stats mostly sit there. " +
      "They stay in the score at low weight rather than being quietly dropped, because picking signals by what already fits your results " +
      "would flatter the model."));
    c4.setTable(["Signal", "Area", "Winrate in softest third", "Winrate in toughest third", "Difference"],
      FACTORS.map((f) => {
        const [lo, hi] = terc(model.factors[f.key]);
        if (!lo.length || !hi.length) return [f.label, f.pillar, "–", "–", "–"];
        return [f.label, PILLARS.find((p) => p.key === f.pillar).label,
          fmt1(mean(lo.map((i) => wins[i])) * 100) + "%", fmt1(mean(hi.map((i) => wins[i])) * 100) + "%",
          signed((mean(lo.map((i) => wins[i])) - mean(hi.map((i) => wins[i]))) * 100) + " pts"];
      }));
    s.grid.append(c4.fig);

    // --- queue sanity check ---
    if (state.queue === "all") {
      const qs = [...groupBy(rows.filter((m, i) => score[i] != null), (m) => m.data_source)]
        .filter(([, a]) => a.length >= 5)
        .map(([q, a]) => [q, a, mean(a.map((m) => m._lobbyScore))])
        .sort((a, b) => b[2] - a[2]);
      if (qs.length >= 2) {
        const c6 = card("Sanity check: does it rank the queues right?", "the score never sees which queue a match came from");
        vCols(c6.body, qs.map(([q, a, z]) => ({
          label: queueLabel(q), sub: `${a.length} games`, mark: queueMark(q), value: z, tipTitle: queueLabel(q),
          tip: [{ value: Math.round(z) + " / 100", label: "average lobby score" },
                { value: fmt1(winrate(a) * 100) + "%", label: "your winrate there" }],
        })), { fmt: (v) => Math.round(v) + "" });
        c6.setTable(["Queue", "Matches", "Average lobby score", "Your winrate"], qs.map(([q, a, z]) => [
          queueLabel(q), a.length, Math.round(z) + " / 100", fmt1(winrate(a) * 100) + "%"]));
        s.grid.append(c6.fig);
      }
    }

    // --- method, folded away ---
    const enemyR = Math.abs(corr(model.enemy.composite, wins) || 0);
    const lobbyR = Math.abs(corr(model.composite, wins) || 0);
    const details = el("details", { class: "method" },
      el("summary", {}, "How the score is built, and why it is built that way"),
      el("ol", {},
        el("li", {}, el("b", {}, "It watches all nine other players, not just the five enemies. "),
          `Judging a lobby by the enemy team alone mostly measures your own result — beat a team and their numbers sag. ` +
          `On this archive an enemy-only score tracks your win/loss at r = ${fmt2(enemyR)}; using the whole server drops that to ${fmt2(lobbyR)}, ` +
          `because your teammates' numbers rise at the same moment the enemy's fall.`),
        el("li", {}, el("b", {}, "Sixteen signals, three areas. "),
          "Aim and mechanics, utility use and discipline, trade structure. A well-drilled lobby shows up in how it spends grenades and trades deaths, " +
          "not only in how fast it clicks heads — the chart above shows which of those actually bite."),
        el("li", {}, el("b", {}, "Short games are not mistaken for soft ones. "),
          "A 13–3 ends quickly and leaves thin data. Every signal has the effect of match length stripped out of it, then gets pulled toward " +
          "the average in proportion to how little of it was measured, so a fast stomp lands near the middle rather than at an extreme."),
        el("li", {}, el("b", {}, "Leetify rating is deliberately not used. "),
          "It is scored relative to the lobby, so the nine others always average to roughly your own rating negated. It says nothing about server strength."),
        el("li", {}, el("b", {}, "The 0–100 is relative to you. "),
          "It ranks this slice of your own matches against each other, so 50 means a typical lobby for you — not a fixed skill level. " +
          "Change the filters and the scale re-forms around whatever is in view.")));
    s.before(details);
    root.append(s.sec);
  }

  if (await loadPlayer(PLAYERS[0])) renderAll();
})();
